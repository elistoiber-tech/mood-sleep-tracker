<script>
  // ---- localStorage-backed shim for window.storage (same interface the app already used in Claude) ----
  // No personal data is stored in this file. Everything lives only in this browser's local storage,
  // added either by using the app day-to-day, or via the "Restore from backup" paste box inside it.
  window.storage = {
    get: async (key) => {
      const v = localStorage.getItem(key);
      if (v === null) return null;
      return { key, value: v, shared: false };
    },
    set: async (key, value) => {
      localStorage.setItem(key, value);
      return { key, value, shared: false };
    },
    delete: async (key) => {
      localStorage.removeItem(key);
      return { key, deleted: true, shared: false };
    },
    list: async (prefix) => {
      const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
      return { keys };
    },
  };
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;



const MOOD_OPTIONS = [
  { value: "green", emoji: "🟢", label: "Good" },
  { value: "yellow", emoji: "🟡", label: "Meh" },
  { value: "orange", emoji: "🟠", label: "Rough" },
  { value: "red", emoji: "🔴", label: "Bad" },
];

const SLEEP_OPTIONS = [
  { value: "solid", emoji: "😴", label: "Solid" },
  { value: "ok", emoji: "😐", label: "Ok" },
  { value: "woke-early", emoji: "👀", label: "Woke early" },
  { value: "awful", emoji: "💀", label: "Awful" },
];

const BLEED_OPTIONS = [
  { value: "none", emoji: "—", label: "None" },
  { value: "spotting", emoji: "🩸", label: "Spotting" },
  { value: "light", emoji: "🩸🩸", label: "Light" },
  { value: "heavier", emoji: "🩸🩸🩸", label: "Heavier" },
];

const MUCUS_OPTIONS = [
  { value: "dry", emoji: "🏜️", label: "Dry", desc: "Dry / relatively dry" },
  { value: "sticky", emoji: "🩹", label: "Sticky", desc: "Cloudy / small sticky globs" },
  { value: "creamy", emoji: "🥛", label: "Creamy", desc: "Creamy / cloudy / thick" },
  { value: "eggwhite", emoji: "🥚", label: "Egg white", desc: "Clear / stretchy / slippery, like raw egg white" },
];

const BODY_TAGS = [
  { value: "bloated", emoji: "🫧", label: "Bloated" },
  { value: "snacky", emoji: "🧁", label: "Snacky" },
  { value: "lean", emoji: "🦴", label: "Lean" },
  { value: "acne", emoji: "🔥", label: "Acne" },
  { value: "boobs-tender", emoji: "🍈", label: "Boobs tender" },
  { value: "high-energy", emoji: "⚡", label: "High energy" },
  { value: "low-energy", emoji: "🔋", label: "Low energy" },
  { value: "cramping", emoji: "🤏", label: "Cramping" },
];

// "acne" above is retired from the Body picker but kept for reading old entries.
const SKIN_TAGS = [
  { value: "cystic", emoji: "🔥", label: "Cystic" },
  { value: "regular", emoji: "🔴", label: "Regular acne" },
  { value: "jawline", emoji: "📍", label: "Jawline/chin" },
  { value: "tretinoin", emoji: "🧴", label: "Tretinoin" },
  { value: "extractions", emoji: "🚫", label: "Extractions" },
];

function getToday() {
  const d = new Date();
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function formatDate(dateStr) {
  const d = new Date(dateStr + "T12:00:00");
  return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
}

function formatDateShort(dateStr) {
  const d = new Date(dateStr + "T12:00:00");
  return d.toLocaleDateString("en-US", { month: "numeric", day: "numeric" });
}

const moodColor = {
  green: "#2D6A4F",
  yellow: "#E9C46A",
  orange: "#E76F51",
  red: "#C1121F",
};

const STORAGE_KEY = "cycle-tracker-entries";
const MEDS_KEY = "cycle-tracker-meds";

function Dashboard({ entries, meds }) {
  const [sel, setSel] = useState(null);

  const MOODC = { green: "#2E9E6A", yellow: "#E9C46A", orange: "#E76F51", red: "#C1121F" };
  const MOODL = { green: "Good", yellow: "Meh", orange: "Rough", red: "Bad" };
  const SLEEPL = { solid: "Solid", ok: "Ok", "woke-early": "Woke early", awful: "Awful" };
  const BLEEDL = { spotting: "spotting", light: "light", heavier: "heavier" };
  const BLEEDI = { spotting: 1, light: 2, heavier: 3 };
  const MUCUSV = {
    dry: { dot: null, label: "Dry" },
    sticky: { dot: "#4E6E8E", label: "Sticky" },
    creamy: { dot: "#5A93C9", label: "Creamy" },
    eggwhite: { dot: "#CDEBFF", ring: true, label: "Egg white" },
    watery: { dot: "#6CB6FF", label: "Watery" },
  };
  const BODYL = {};
  BODY_TAGS.forEach(t => { BODYL[t.value] = t.emoji + " " + t.label; });
  const SKINL = {};
  SKIN_TAGS.forEach(t => { SKINL[t.value] = t.emoji + " " + t.label; });
  // Unify new skin field with legacy body "acne" so old history still shows.
  const acneState = (e) => {
    const skin = e.skin || [];
    if (skin.includes("cystic")) return "cystic";
    if (skin.includes("regular") || (e.body || []).includes("acne")) return "regular";
    return null;
  };

  const medList = meds || [];
  const medDates = new Set(medList.map(m => m.date));
  const keys = Object.keys(entries).sort();

  const parseD = (s) => new Date(s + "T12:00:00");
  const dbetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);
  const fmtS = (s) => parseD(s).toLocaleDateString("en-US", { month: "short", day: "numeric" });
  const fmtL = (s) => parseD(s).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  const dstr = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;

  if (keys.length === 0) {
    return (
      <div style={{ padding: "48px 24px", textAlign: "center", fontFamily: "'DM Sans', sans-serif", fontSize: 13, color: "#484F58", lineHeight: 1.6 }}>
        Log a few days first, then your dashboard fills in here — a calendar, your bleeding rhythm, and medicine markers.
      </div>
    );
  }

  const total = keys.length;
  const span = dbetween(keys[0], keys[keys.length - 1]) + 1;
  const bleedDays = keys.filter(k => entries[k].bleed && entries[k].bleed !== "none").length;

  // months
  const first = parseD(keys[0]), last = parseD(keys[keys.length - 1]);
  const months = [];
  let yy = first.getFullYear(), mm = first.getMonth();
  const eY = last.getFullYear(), eM = last.getMonth();
  while (yy < eY || (yy === eY && mm <= eM)) { months.push([yy, mm]); mm++; if (mm > 11) { mm = 0; yy++; } }

  // bleed episodes
  const bleedDatesArr = keys.filter(k => entries[k].bleed && entries[k].bleed !== "none");
  const episodes = [];
  let cur = null;
  bleedDatesArr.forEach(d => {
    if (cur && dbetween(cur.end, d) <= 2) { cur.end = d; cur.days.push(d); cur.maxI = Math.max(cur.maxI, BLEEDI[entries[d].bleed] || 1); }
    else { cur = { start: d, end: d, days: [d], maxI: BLEEDI[entries[d].bleed] || 1 }; episodes.push(cur); }
  });
  const tenderBefore = (start) => {
    for (let b = 1; b <= 5; b++) { const ds = dstr(new Date(parseD(start).getTime() - b * 86400000)); if (entries[ds] && (entries[ds].body || []).includes("boobs-tender")) return true; }
    return false;
  };
  const preTally = {}; let tenderCount = 0;
  episodes.forEach(ep => {
    const seen = new Set();
    for (let b = 1; b <= 5; b++) { const ds = dstr(new Date(parseD(ep.start).getTime() - b * 86400000)); if (entries[ds]) (entries[ds].body || []).forEach(t => seen.add(t)); }
    if (seen.has("boobs-tender")) tenderCount++;
    seen.forEach(t => preTally[t] = (preTally[t] || 0) + 1);
  });
  const preTop = Object.entries(preTally).sort((a, b) => b[1] - a[1]).slice(0, 3);

  const dow = ["S", "M", "T", "W", "T", "F", "S"];
  const selE = sel ? entries[sel] : null;

  return (
    <div className="dash">
      <style>{`
        .dash { padding: 16px 20px; }
        .dash .d-sec { margin-bottom: 26px; }
        .dash .d-lbl { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #8B949E; margin: 0 0 3px; }
        .dash .d-note { font-family: 'DM Sans', sans-serif; font-size: 12px; color: #565E68; margin: 0 0 14px; line-height: 1.5; }
        .dash .d-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 26px; }
        .dash .d-stat { background: #12161C; border: 1px solid #21262D; border-radius: 12px; padding: 12px 8px; text-align: center; }
        .dash .d-stat .n { font-family: 'Newsreader', serif; font-size: 22px; color: #E6EDF3; line-height: 1; }
        .dash .d-stat .l { font-family: 'DM Sans', sans-serif; font-size: 10px; color: #565E68; margin-top: 5px; }
        .dash .dmonths { display: flex; flex-direction: column; gap: 18px; }
        .dash .dmonth { font-family: 'Newsreader', serif; font-size: 16px; color: #E6EDF3; margin: 0 0 8px; }
        .dash .ddow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 4px; }
        .dash .ddow span { text-align: center; font-family: 'DM Sans', sans-serif; font-size: 9px; color: #565E68; font-weight: 600; }
        .dash .dgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .dash .dcell { aspect-ratio: 1 / 1; border-radius: 7px; position: relative; display: flex; align-items: flex-start; justify-content: flex-end; padding: 3px 4px 0 0; font-family: 'DM Sans', sans-serif; font-size: 8.5px; color: #565E68; border: 1px solid transparent; }
        .dash .dcell.logged { color: rgba(255,255,255,0.55); cursor: pointer; border-color: #21262D; }
        .dash .dcell.sel { outline: 2px solid #6CB6FF; }
        .dash .dmarks { position: absolute; left: 4px; bottom: 3px; right: 4px; display: flex; align-items: center; gap: 3px; height: 6px; }
        .dash .dbleed { flex: 1; height: 3px; border-radius: 2px; background: #F47067; }
        .dash .ddot { width: 5px; height: 5px; border-radius: 50%; flex: 0 0 auto; }
        .dash .dacne { width: 5px; height: 5px; border-radius: 50%; flex: 0 0 auto; }
        .dash .dmed { position: absolute; top: 3px; left: 4px; width: 6px; height: 6px; border-radius: 2px; background: #A371F7; }
        .dash .dlegend { display: flex; flex-wrap: wrap; gap: 8px 12px; margin-top: 14px; }
        .dash .dlg { display: flex; align-items: center; gap: 6px; font-family: 'DM Sans', sans-serif; font-size: 11px; color: #8B949E; }
        .dash .dsw { width: 11px; height: 11px; border-radius: 3px; flex: 0 0 auto; }
        .dash .dmkey { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 10px; padding-top: 12px; border-top: 1px dashed #21262D; }
        .dash .dmk-title { font-family: 'DM Sans', sans-serif; font-size: 11px; color: #565E68; font-weight: 600; }
        .dash .dmk-dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
        .dash .ddetail { margin-top: 14px; background: #161B22; border: 1px solid #21262D; border-radius: 12px; padding: 14px; font-family: 'DM Sans', sans-serif; font-size: 12.5px; color: #8B949E; line-height: 1.6; }
        .dash .ddetail.muted { color: #565E68; }
        .dash .ddetail .dd-date { font-family: 'Newsreader', serif; font-size: 15px; color: #E6EDF3; margin-bottom: 6px; }
        .dash .ddetail .dd-ctx { color: #E6EDF3; margin-top: 8px; font-style: italic; }
        .dash .depi { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #12161C; border: 1px solid #21262D; border-radius: 12px; border-left: 3px solid #F47067; }
        .dash .depi-date { font-family: 'Newsreader', serif; font-size: 15px; color: #E6EDF3; flex: 0 0 auto; width: 84px; }
        .dash .depi-meta { font-family: 'DM Sans', sans-serif; font-size: 11.5px; color: #8B949E; line-height: 1.4; }
        .dash .depi-meta b { color: #E6EDF3; font-weight: 600; }
        .dash .dgap { text-align: center; font-family: 'DM Sans', sans-serif; font-size: 10.5px; color: #565E68; padding: 5px 0; }
        .dash .dtender { display: inline-block; font-family: 'DM Sans', sans-serif; font-size: 10px; color: #F4A261; background: #3a2c17; border: 1px solid #5a441f; border-radius: 999px; padding: 1px 7px; margin-top: 4px; }
        .dash .dinsight { font-family: 'DM Sans', sans-serif; font-size: 12.5px; color: #E6EDF3; line-height: 1.6; margin: 0; background: #12161C; border: 1px solid #21262D; border-radius: 14px; padding: 16px; }
        .dash .dinsight b { color: #6CB6FF; font-weight: 600; }
        .dash .dmedrow { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; background: #12161C; border: 1px solid #21262D; border-radius: 12px; border-left: 3px solid #A371F7; margin-bottom: 8px; }
        .dash .dmed-date { font-family: 'Newsreader', serif; font-size: 14px; color: #E6EDF3; flex: 0 0 auto; width: 84px; }
        .dash .dmed-note { font-family: 'DM Sans', sans-serif; font-size: 12.5px; color: #8B949E; line-height: 1.45; }
        .dash .depi-wrap { display: flex; flex-direction: column; gap: 8px; }
      `}</style>

      <div className="d-stats">
        {[[total, "days logged"], [span, "day span"], [bleedDays, "bleed days"]].map(([n, l]) => (
          <div className="d-stat" key={l}><div className="n">{n}</div><div className="l">{l}</div></div>
        ))}
      </div>

      <div className="d-sec">
        <p className="d-lbl">Calendar</p>
        <p className="d-note">Each day is tinted by mood. Red bar = bleeding, blue dot = mucus, purple square = medicine change.</p>
        <div className="dmonths">
          {months.map(([y, m]) => {
            const monthName = new Date(y, m, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });
            const firstDow = new Date(y, m, 1).getDay();
            const dim = new Date(y, m + 1, 0).getDate();
            const cells = [];
            for (let i = 0; i < firstDow; i++) cells.push(<div key={"b" + i} className="dcell"></div>);
            for (let d = 1; d <= dim; d++) {
              const ds = `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
              const e = entries[ds];
              if (!e) { cells.push(<div key={ds} className="dcell">{d}</div>); continue; }
              const mc = e.mood && MOODC[e.mood] ? MOODC[e.mood] : "#2b323b";
              const bg = e.mood ? mc + "44" : "#1b212a";
              const bord = e.mood ? mc + "88" : "#2b323b";
              const hasBleed = e.bleed && e.bleed !== "none";
              const mv = e.mucus && MUCUSV[e.mucus] ? MUCUSV[e.mucus] : null;
              const hasDot = mv && mv.dot;
              const ac = acneState(e);
              cells.push(
                <div key={ds} className={"dcell logged" + (sel === ds ? " sel" : "")} style={{ background: bg, borderColor: bord }} onClick={() => setSel(ds)}>
                  {medDates.has(ds) && <div className="dmed"></div>}
                  {d}
                  {(hasBleed || hasDot || ac) && (
                    <div className="dmarks">
                      {hasBleed ? <div className="dbleed" style={{ opacity: 0.5 + 0.25 * (BLEEDI[e.bleed] || 1) }}></div> : <div style={{ flex: 1 }}></div>}
                      {hasDot && <div className="ddot" style={{ background: mv.dot, boxShadow: mv.ring ? "0 0 0 1.5px rgba(255,255,255,0.9)" : "none" }}></div>}
                      {ac && <div className="dacne" style={{ background: ac === "cystic" ? "#E5484D" : "#F4A261", boxShadow: ac === "cystic" ? "0 0 0 1.5px rgba(255,255,255,0.55)" : "none" }}></div>}
                    </div>
                  )}
                </div>
              );
            }
            return (
              <div key={y + "-" + m}>
                <div className="dmonth">{monthName}</div>
                <div className="ddow">{dow.map((x, i) => <span key={i}>{x}</span>)}</div>
                <div className="dgrid">{cells}</div>
              </div>
            );
          })}
        </div>

        <div className="dlegend">
          {Object.keys(MOODC).map(k => (
            <span className="dlg" key={k}><span className="dsw" style={{ background: MOODC[k] }}></span>{MOODL[k]}</span>
          ))}
          <span className="dlg"><span className="dsw" style={{ background: "#F47067", borderRadius: 2, height: 4 }}></span>Bleeding</span>
          <span className="dlg"><span className="dsw" style={{ background: "#A371F7", borderRadius: 2 }}></span>Med change</span>
          <span className="dlg"><span className="dsw" style={{ background: "#E5484D", borderRadius: "50%" }}></span>Cystic</span>
          <span className="dlg"><span className="dsw" style={{ background: "#F4A261", borderRadius: "50%" }}></span>Regular acne</span>
        </div>
        <div className="dmkey">
          <span className="dmk-title">Mucus dot, dry → fertile:</span>
          {["sticky", "creamy", "eggwhite"].map(k => (
            <span className="dlg" key={k}><span className="dmk-dot" style={{ background: MUCUSV[k].dot, boxShadow: MUCUSV[k].ring ? "0 0 0 1.5px rgba(255,255,255,0.9)" : "none" }}></span>{MUCUSV[k].label}</span>
          ))}
        </div>

        {sel && selE ? (
          <div className="ddetail">
            <div className="dd-date">{fmtL(sel)}</div>
            {selE.mood && <div>Mood: <b style={{ color: MOODC[selE.mood] }}>{MOODL[selE.mood]}</b></div>}
            {selE.sleep && <div>Sleep: {SLEEPL[selE.sleep] || selE.sleep}</div>}
            {selE.bleed && selE.bleed !== "none" && <div>Bleed: {BLEEDL[selE.bleed] || selE.bleed}</div>}
            {selE.mucus && <div>Mucus: {(MUCUSV[selE.mucus] || {}).label || selE.mucus}</div>}
            {selE.body && selE.body.length > 0 && <div>Body: {selE.body.map(b => BODYL[b] || b).join(", ")}</div>}
            {selE.skin && selE.skin.length > 0 && <div>Skin: {selE.skin.map(s => SKINL[s] || s).join(", ")}</div>}
            {medDates.has(sel) && <div style={{ color: "#A371F7" }}>💊 {(medList.find(m => m.date === sel) || {}).note}</div>}
            {selE.context && <div className="dd-ctx">"{selE.context}"</div>}
          </div>
        ) : (
          <div className="ddetail muted">Tap any logged day to see the full entry.</div>
        )}
      </div>

      <div className="d-sec">
        <p className="d-lbl">Bleeding rhythm</p>
        <p className="d-note">Your bleed episodes and the gap between each. With an IUD this won't be a clean monthly clock, but the intervals still tell a story.</p>
        <div className="depi-wrap">
          {episodes.length === 0 ? (
            <p className="d-note" style={{ margin: 0 }}>No bleeding logged yet.</p>
          ) : episodes.map((ep, i) => {
            const len = ep.days.length;
            const label = ep.maxI >= 2 ? "light bleed" : "spotting";
            const range = ep.start === ep.end ? fmtS(ep.start) : `${fmtS(ep.start)}–${parseD(ep.end).getDate()}`;
            const tender = tenderBefore(ep.start);
            const gap = i > 0 ? dbetween(episodes[i - 1].start, ep.start) : null;
            return (
              <React.Fragment key={ep.start}>
                {gap !== null && <div className="dgap">↕ {gap} days later</div>}
                <div className="depi">
                  <div className="depi-date">{range}</div>
                  <div className="depi-meta"><b>{label}</b>, {len} day{len > 1 ? "s" : ""}{tender && <><br /><span className="dtender">🍈 tender breasts before</span></>}</div>
                </div>
              </React.Fragment>
            );
          })}
        </div>
      </div>

      {episodes.length > 0 && (
        <div className="d-sec">
          <p className="d-lbl">Before a bleed</p>
          <p className="d-note">What your body flagged in the 5 days leading into each bleed episode.</p>
          <p className="dinsight">
            Tender breasts showed up before <b>{tenderCount} of your {episodes.length}</b> bleed episode{episodes.length > 1 ? "s" : ""}, which makes it your most reliable heads-up that bleeding is coming.
            {preTop.length > 0 && <span> Most common in the 5 days before a bleed: {preTop.map(([t, n]) => `${BODYL[t] || t} (${n})`).join(", ")}.</span>}
          </p>
        </div>
      )}

      {(() => {
        let cystic = 0, regular = 0, tret = 0, jaw = 0; const extractions = [];
        keys.forEach(k => {
          const e = entries[k]; const skin = e.skin || []; const ac = acneState(e);
          if (ac === "cystic") cystic++; else if (ac === "regular") regular++;
          if (skin.includes("tretinoin")) tret++;
          if (skin.includes("jawline")) jaw++;
          if (skin.includes("extractions")) extractions.push(k);
        });
        if (cystic + regular + tret + jaw + extractions.length === 0) return null;
        return (
          <div className="d-sec">
            <p className="d-lbl">Skin</p>
            <p className="d-note">Cystic and regular acne show on the calendar (cystic = deep red dot, regular = orange). Tretinoin and extractions are tracked here.</p>
            <div className="dinsight" style={{ display: "flex", flexDirection: "column", gap: 7 }}>
              <div>🔥 Cystic: <b>{cystic}</b> {cystic === 1 ? "day" : "days"}  ·  🔴 Regular: <b>{regular}</b> {regular === 1 ? "day" : "days"}</div>
              {jaw > 0 && <div>📍 Jawline / chin: <b>{jaw}</b> {jaw === 1 ? "day" : "days"}</div>}
              <div>🧴 Tretinoin applied: <b>{tret}</b> {tret === 1 ? "day" : "days"}</div>
              {extractions.length > 0 && <div>🚫 Extractions: {extractions.map(d => fmtS(d)).join(", ")}</div>}
            </div>
          </div>
        );
      })()}

      {medList.length > 0 && (
        <div className="d-sec">
          <p className="d-lbl">Medicine changes</p>
          <p className="d-note">Marked on the calendar too, so you can watch mood and sleep in the weeks after each change.</p>
          {medList.slice().sort((a, b) => a.date.localeCompare(b.date)).map(mv => (
            <div className="dmedrow" key={mv.id || (mv.date + mv.note)}>
              <div className="dmed-date">{fmtS(mv.date)}</div>
              <div className="dmed-note">{mv.note}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function CycleTracker() {
  const [entries, setEntries] = useState({});
  const [meds, setMeds] = useState([]);
  const [currentDate, setCurrentDate] = useState(getToday());
  const [view, setView] = useState("log"); // log | history | meds | export
  const [saved, setSaved] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [copied, setCopied] = useState(false);
  const [copiedJSON, setCopiedJSON] = useState(false);
  const [importText, setImportText] = useState("");
  const [importMessage, setImportMessage] = useState("");
  const [medDate, setMedDate] = useState(getToday());
  const [medNote, setMedNote] = useState("");

  // Load from persistent storage
  useEffect(() => {
    async function load() {
      try {
        const result = await window.storage.get(STORAGE_KEY);
        if (result && result.value) {
          setEntries(JSON.parse(result.value));
        }
      } catch (e) {
        // No data yet, that's fine
      }
      try {
        const medResult = await window.storage.get(MEDS_KEY);
        if (medResult && medResult.value) {
          setMeds(JSON.parse(medResult.value));
        }
      } catch (e) {
        // No meds yet, that's fine
      }
      setLoaded(true);
    }
    load();
  }, []);

  // Save to persistent storage
  const saveEntries = useCallback(async (newEntries) => {
    setEntries(newEntries);
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify(newEntries));
      setSaved(true);
      setTimeout(() => setSaved(false), 1500);
    } catch (e) {
      console.error("Save failed:", e);
    }
  }, []);

  // Save meds to persistent storage
  const saveMeds = useCallback(async (newMeds) => {
    setMeds(newMeds);
    try {
      await window.storage.set(MEDS_KEY, JSON.stringify(newMeds));
      setSaved(true);
      setTimeout(() => setSaved(false), 1500);
    } catch (e) {
      console.error("Save failed:", e);
    }
  }, []);

  const addMed = () => {
    if (!medNote.trim()) return;
    const entry = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      date: medDate,
      note: medNote.trim(),
    };
    saveMeds([...meds, entry]);
    setMedNote("");
    setMedDate(getToday());
  };

  const removeMed = (id) => {
    if (confirm("Remove this medicine entry?")) {
      saveMeds(meds.filter(m => m.id !== id));
    }
  };

  const current = entries[currentDate] || {
    mood: null,
    sleep: null,
    sleepTime: "",
    bleed: "none",
    mucus: null,
    body: [],
    skin: [],
    context: "",
  };

  const updateField = (field, value) => {
    const updated = {
      ...entries,
      [currentDate]: { ...current, [field]: value },
    };
    saveEntries(updated);
  };

  const toggleBody = (tag) => {
    const body = current.body || [];
    const updated = body.includes(tag)
      ? body.filter(t => t !== tag)
      : [...body, tag];
    updateField("body", updated);
  };

  const toggleSkin = (tag) => {
    const skin = current.skin || [];
    const updated = skin.includes(tag)
      ? skin.filter(t => t !== tag)
      : [...skin, tag];
    updateField("skin", updated);
  };

  // Navigate dates
  const shiftDate = (days) => {
    const d = new Date(currentDate + "T12:00:00");
    d.setDate(d.getDate() + days);
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    const newDate = `${year}-${month}-${day}`;
    if (newDate <= getToday()) setCurrentDate(newDate);
  };

  // Generate export text
  const generateExport = () => {
    const sorted = Object.keys(entries).sort();
    if (sorted.length === 0) return "No entries yet!";
    let text = "";
    sorted.forEach(date => {
      const e = entries[date];
      const moodObj = MOOD_OPTIONS.find(m => m.value === e.mood);
      const sleepObj = SLEEP_OPTIONS.find(s => s.value === e.sleep);
      const bleedObj = BLEED_OPTIONS.find(b => b.value === e.bleed);
      const bodyTags = (e.body || []).map(b => {
        const tag = BODY_TAGS.find(t => t.value === b);
        return tag ? tag.emoji + " " + tag.label.toLowerCase() : b;
      });

      text += `${formatDate(date)}\n`;
      text += `mood: ${moodObj ? moodObj.emoji : "—"}\n`;
      text += `sleep: ${sleepObj ? sleepObj.emoji + " " + sleepObj.label.toLowerCase() : "—"}${e.sleepTime ? " " + e.sleepTime : ""}\n`;
      if (e.bleed && e.bleed !== "none") {
        text += `bleed: ${bleedObj ? bleedObj.emoji + " " + bleedObj.label.toLowerCase() : e.bleed}\n`;
      }
      if (e.mucus) {
        const mObj = MUCUS_OPTIONS.find(m => m.value === e.mucus);
        text += `mucus: ${mObj ? mObj.emoji + " " + mObj.label.toLowerCase() : e.mucus}\n`;
      }
      if (bodyTags.length > 0) {
        text += `body: ${bodyTags.join(", ")}\n`;
      }
      const skinTags = (e.skin || []).map(s => {
        const t = SKIN_TAGS.find(x => x.value === s);
        return t ? t.emoji + " " + t.label.toLowerCase() : s;
      });
      if (skinTags.length > 0) {
        text += `skin: ${skinTags.join(", ")}\n`;
      }
      if (e.context && e.context.trim()) {
        text += `context: ${e.context.trim()}\n`;
      }
      text += "\n";
    });
    if (meds && meds.length > 0) {
      text += "\n--- medicine changes ---\n";
      [...meds].sort((a, b) => a.date.localeCompare(b.date)).forEach(m => {
        text += `${formatDate(m.date)}: ${m.note}\n`;
      });
    }
    return text.trim();
  };

  // Full JSON export: lossless, includes daily entries + meds log
  const generateJSON = () => {
    return JSON.stringify({
      app: "cycle-check",
      version: 2,
      exportedAt: new Date().toISOString(),
      entries,
      meds,
    }, null, 2);
  };

  const handleDownloadJSON = () => {
    try {
      const blob = new Blob([generateJSON()], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `cycle-check-backup-${getToday()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (e) {
      console.error("Download failed:", e);
    }
  };

  const handleCopyJSON = async () => {
    const text = generateJSON();
    try {
      await navigator.clipboard.writeText(text);
      setCopiedJSON(true);
      setTimeout(() => setCopiedJSON(false), 2000);
    } catch {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      setCopiedJSON(true);
      setTimeout(() => setCopiedJSON(false), 2000);
    }
  };

  const handleCopy = async () => {
    const text = generateExport();
    try {
      await navigator.clipboard.writeText(text);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    }
  };

  const parseImportText = (text) => {
    const monthMap = { Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5, Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11 };
    const blocks = text.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
    const result = { ...entries };
    let count = 0;

    blocks.forEach(block => {
      const lines = block.split("\n").filter(l => l.trim().length > 0);
      if (lines.length === 0) return;
      const dateMatch = lines[0].match(/(\w+),\s*(\w+)\s+(\d+)/);
      if (!dateMatch || !(dateMatch[2] in monthMap)) return;
      const month = monthMap[dateMatch[2]];
      const day = parseInt(dateMatch[3], 10);

      const now = new Date();
      let year = now.getFullYear();
      if (new Date(year, month, day) > now) year -= 1;
      const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;

      const entry = { mood: null, sleep: null, sleepTime: "", bleed: "none", mucus: null, body: [], skin: [], context: "" };
      const contextLines = [];
      let inContext = false;

      for (let i = 1; i < lines.length; i++) {
        const line = lines[i];
        if (line.startsWith("mood:")) {
          inContext = false;
          const val = line.slice(5).trim();
          const m = MOOD_OPTIONS.find(o => val.startsWith(o.emoji));
          entry.mood = m ? m.value : null;
        } else if (line.startsWith("sleep:")) {
          inContext = false;
          const rest = line.slice(6).trim();
          if (!rest || rest.startsWith("—")) {
            entry.sleep = null;
          } else {
            const s = SLEEP_OPTIONS.find(o => rest.startsWith(o.emoji));
            entry.sleep = s ? s.value : null;
            if (s) {
              let trailing = rest.slice(s.emoji.length).trim();
              if (trailing.toLowerCase().startsWith(s.label.toLowerCase())) {
                trailing = trailing.slice(s.label.length).trim();
              }
              if (trailing) entry.sleepTime = trailing;
            }
          }
        } else if (line.startsWith("bleed:")) {
          inContext = false;
          const rest = line.slice(6).trim();
          const b = BLEED_OPTIONS.find(o => o.value !== "none" && rest.startsWith(o.emoji));
          entry.bleed = b ? b.value : "none";
        } else if (line.startsWith("mucus:")) {
          inContext = false;
          const rest = line.slice(6).trim();
          const m = MUCUS_OPTIONS.find(o => rest.startsWith(o.emoji));
          entry.mucus = m ? m.value : null;
        } else if (line.startsWith("body:")) {
          inContext = false;
          const rest = line.slice(5).trim();
          entry.body = rest.split(",").map(t => t.trim()).map(t => {
            const found = BODY_TAGS.find(tag => t.startsWith(tag.emoji));
            return found ? found.value : null;
          }).filter(Boolean);
        } else if (line.startsWith("skin:")) {
          inContext = false;
          const rest = line.slice(5).trim();
          entry.skin = rest.split(",").map(t => t.trim()).map(t => {
            const found = SKIN_TAGS.find(tag => t.startsWith(tag.emoji));
            return found ? found.value : null;
          }).filter(Boolean);
        } else if (line.startsWith("context:")) {
          inContext = true;
          contextLines.push(line.slice(8).trim());
        } else if (inContext) {
          contextLines.push(line.trim());
        }
      }
      entry.context = contextLines.join(" ").trim();
      result[dateStr] = entry;
      count++;
    });

    return { result, count };
  };

  // Accepts JSON (preferred, lossless) or the older readable text. Merges into current data.
  const applyImport = (text) => {
    const trimmed = (text || "").trim();
    if (trimmed.startsWith("{")) {
      try {
        const data = JSON.parse(trimmed);
        const newEntries = data.entries && typeof data.entries === "object"
          ? { ...entries, ...data.entries }
          : entries;
        let medCount = 0;
        if (Array.isArray(data.meds)) {
          const existingIds = new Set(meds.map(m => m.id));
          const toAdd = data.meds.filter(m => m && m.id && !existingIds.has(m.id));
          if (toAdd.length > 0) {
            saveMeds([...meds, ...toAdd]);
            medCount = toAdd.length;
          }
        }
        const entryCount = data.entries ? Object.keys(data.entries).length : 0;
        if (entryCount > 0) saveEntries(newEntries);
        return { count: entryCount, medCount };
      } catch (e) {
        // not valid JSON — fall through to text parser
      }
    }
    const { result, count } = parseImportText(trimmed);
    if (count > 0) saveEntries(result);
    return { count, medCount: 0 };
  };

  const importResultMessage = (count, medCount) => {
    const parts = [];
    parts.push(`${count} ${count === 1 ? "entry" : "entries"}`);
    if (medCount) parts.push(`${medCount} med ${medCount === 1 ? "change" : "changes"}`);
    return `Imported ${parts.join(" and ")}.`;
  };

  const handleImport = () => {
    if (!importText.trim()) {
      setImportMessage("Paste your backup above first.");
      return;
    }
    const { count, medCount } = applyImport(importText);
    if (count === 0 && medCount === 0) {
      setImportMessage("Couldn't find anything to import — check the format and try again.");
      return;
    }
    setImportMessage(importResultMessage(count, medCount));
    setImportText("");
  };

  const handleImportFile = (ev) => {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const { count, medCount } = applyImport(String(reader.result));
      if (count === 0 && medCount === 0) {
        setImportMessage("Couldn't read that file — is it a cycle check backup?");
      } else {
        setImportMessage(importResultMessage(count, medCount));
      }
    };
    reader.onerror = () => setImportMessage("Couldn't read that file.");
    reader.readAsText(file);
    ev.target.value = "";
  };

  const sortedDates = Object.keys(entries).sort().reverse();
  const entryCount = sortedDates.length;

  const isToday = currentDate === getToday();

  if (!loaded) {
    return (
      <div style={{
        fontFamily: "'Newsreader', Georgia, serif",
        background: "#0A0C10",
        color: "#C9D1D9",
        minHeight: "100vh",
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
      }}>
        <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,300;0,400;0,600;1,300&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
        <p style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 14, color: "#484F58" }}>Loading…</p>
      </div>
    );
  }

  return (
    <div style={{
      fontFamily: "'Newsreader', Georgia, serif",
      background: "#0A0C10",
      color: "#C9D1D9",
      minHeight: "100vh",
      padding: "0 0 80px",
      maxWidth: 480,
      margin: "0 auto",
    }}>
      <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,300;0,400;0,600;1,300&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

      <div style={{
        padding: "20px 20px 16px",
        borderBottom: "1px solid #161B22",
        position: "sticky",
        top: 0,
        background: "#0A0C10",
        zIndex: 10,
      }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <h1 style={{
            fontSize: 22,
            fontWeight: 300,
            color: "#E6EDF3",
            margin: 0,
            letterSpacing: "-0.03em",
          }}>
            cycle check
          </h1>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            {saved && (
              <span style={{
                fontFamily: "'DM Sans', sans-serif",
                fontSize: 10,
                color: "#2D6A4F",
              }}>saved ✓</span>
            )}
            <span style={{
              fontFamily: "'DM Sans', sans-serif",
              fontSize: 11,
              color: "#484F58",
              padding: "3px 8px",
              background: "#161B22",
              borderRadius: 10,
            }}>
              {entryCount} {entryCount === 1 ? "entry" : "entries"}
            </span>
          </div>
        </div>

        <div style={{ display: "flex", flexWrap: "wrap", gap: 2, marginTop: 12 }}>
          {[
            { key: "log", label: "Log" },
            { key: "dashboard", label: "Dashboard" },
            { key: "history", label: "History" },
            { key: "meds", label: "Meds" },
            { key: "export", label: "Share" },
          ].map(tab => (
            <button
              key={tab.key}
              onClick={() => setView(tab.key)}
              style={{
                fontFamily: "'DM Sans', sans-serif",
                fontSize: 12,
                fontWeight: view === tab.key ? 600 : 400,
                padding: "5px 14px",
                borderRadius: 6,
                border: "none",
                cursor: "pointer",
                background: view === tab.key ? "#161B22" : "transparent",
                color: view === tab.key ? "#E6EDF3" : "#484F58",
              }}
            >
              {tab.label}
            </button>
          ))}
        </div>
      </div>

      {view === "log" && (
        <div style={{ padding: "16px 20px" }}>
          <div style={{
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
            marginBottom: 24,
          }}>
            <button onClick={() => shiftDate(-1)} style={{
              background: "#161B22",
              border: "none",
              color: "#8B949E",
              fontSize: 18,
              width: 40,
              height: 40,
              borderRadius: 8,
              cursor: "pointer",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
            }}>←</button>
            <div style={{ textAlign: "center" }}>
              <div style={{
                fontFamily: "'Newsreader', Georgia, serif",
                fontSize: 18,
                color: "#E6EDF3",
                fontWeight: 400,
              }}>
                {formatDate(currentDate)}
              </div>
              {isToday && (
                <div style={{
                  fontFamily: "'DM Sans', sans-serif",
                  fontSize: 10,
                  color: "#2D6A4F",
                  marginTop: 2,
                }}>today</div>
              )}
            </div>
            <button
              onClick={() => shiftDate(1)}
              disabled={isToday}
              style={{
                background: "#161B22",
                border: "none",
                color: isToday ? "#21262D" : "#8B949E",
                fontSize: 18,
                width: 40,
                height: 40,
                borderRadius: 8,
                cursor: isToday ? "default" : "pointer",
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
              }}
            >→</button>
          </div>

          <div style={{ marginBottom: 20 }}>
            <div style={{
              fontFamily: "'DM Sans', sans-serif",
              fontSize: 11,
              color: "#8B949E",
              marginBottom: 8,
              textTransform: "uppercase",
              letterSpacing: "0.08em",
            }}>
              Mood
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 6 }}>
              {MOOD_OPTIONS.map(opt => {
                const selected = current.mood === opt.value;
                return (
                  <button
                    key={opt.value}
                    onClick={() => updateField("mood", opt.value)}
                    style={{
                      background: selected ? (moodColor[opt.value] || "#161B22") + "33" : "#161B22",
                      border: selected ? `2px solid ${moodColor[opt.value]}` : "2px solid transparent",
                      borderRadius: 10,
                      padding: "12px 4px",
                      cursor: "pointer",
                      display: "flex",
                      flexDirection: "column",
                      alignItems: "center",
                      gap: 4,
                      transition: "all 0.15s",
                    }}
                  >
                    <span style={{ fontSize: 22 }}>{opt.emoji}</span>
                    <span style={{
                      fontFamily: "'DM Sans', sans-serif",
                      fontSize: 10,
                      color: selected ? "#E6EDF3" : "#484F58",
                    }}>{opt.label}</span>
                  </button>
                );
              })}
            </div>
          </div>

          <div style={{ marginBottom: 20 }}>
            <div style={{
              fontFamily: "'DM Sans', sans-serif",
              fontSize: 11,
              color: "#8B949E",
              marginBottom: 8,
              textTransform: "uppercase",
              letterSpacing: "0.08em",
            }}>
              Sleep
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 6 }}>
              {SLEEP_OPTIONS.map(opt => {
                const selected = current.sleep === opt.value;
                return (
                  <button
                    key={opt.value}
                    onClick={() => updateField("sleep", opt.value)}
                    style={{
                      background: selected ? "#A371F733" : "#161B22",
                      border: selected ? "2px solid #A371F7" : "2px solid transparent",
                      borderRadius: 10,
                      padding: "12px 4px",
                      cursor: "pointer",
                      display: "flex",
                      flexDirection: "column",
                      alignItems: "center",
                      gap: 4,
                      transition: "all 0.15s",
                    }}
                  >
                    <span style={{ fontSize: 22 }}>{opt.emoji}</span>
                    <span style={{
                      fontFamily: "'DM Sans', sans-serif",
                      fontSize: 10,
                      color: selected ? "#E6EDF3" : "#484F58",
                    }}>{opt.label}</span>
                  </button>
                );
              })}
            </div>
            {(current.sleep === "woke-early" || current.sleep === "awful") && (
              <input
                type="text"
                placeholder="What time? (e.g. 4:30am)"
                value={current.sleepTime || ""}
                onChange={e => updateField("sleepTime", e.target.value)}
                style={{
                  width: "100%",
                  marginTop: 8,
                  padding: "8px 12px",
                  background: "#161B22",
                  border: "1px solid #21262D",
                  borderRadius: 8,
                  color: "#E6EDF3",
                  fontFamily: "'DM Sans', sans-serif",
                  fontSize: 13,
                  outline: "none",
                  boxSizing: "border-box",
                }}
              />
            )}
          </div>

          <div style={{ marginBottom: 20 }}>
            <div style={{
              fontFamily: "'DM Sans', sans-serif",
              fontSize: 11,
              color: "#8B949E",
              marginBottom: 8,
              textTransform: "uppercase",
              letterSpacing: "0.08em",
            }}>
              Bleeding
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 6 }}>
              {BLEED_OPTIONS.map(opt => {
                const selected = (current.bleed || "none") === opt.value;
                return (
                  <button
                    key={opt.value}
                    onClick={() => updateField("bleed", opt.value)}
                    style={{
                      background: selected ? (opt.value === "none" ? "#30363D" : "#F4706733") : "#161B22",
                      border: selected ? `2px solid ${opt.value === "none" ? "#8B949E" : "#F47067"}` : "2px solid transparent",
                      borderRadius: 10,
                      padding: "12px 4px",
                      cursor: "pointer",
                      display: "flex",
                      flexDirection: "column",
                      alignItems: "center",
                      gap: 4,
                      transition: "all 0.15s",
                    }}
                  >
                    <span style={{ fontSize: opt.value === "none" ? 16 : 18 }}>{opt.emoji}</span>
                    <span style={{
                      fontFamily: "'DM Sans', sans-serif",
                      fontSize: 10,
                      color: selected ? "#E6EDF3" : "#484F58",
                    }}>{opt.label}</span>
                  </button>
                );
              })}
            </div>
          </div>

          <div style={{ marginBottom: 20 }}>
            <div style={{
              fontFamily: "'DM Sans', sans-serif",
              fontSize: 11,
              color: "#8B949E",
              marginBottom: 8,
              textTransform: "uppercase",
              letterSpacing: "0.08em",
            }}>
              Cervical mucus <span style={{ textTransform: "none", fontWeight: 400, opacity: 0.6 }}>(tap one, tap again to clear)</span>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {MUCUS_OPTIONS.map(opt => {
                const selected = current.mucus === opt.value;
                return (
                  <button
                    key={opt.value}
                    onClick={() => updateField("mucus", selected ? null : opt.value)}
                    style={{
                      background: selected ? "#6CB6FF33" : "#161B22",
                      border: selected ? "2px solid #6CB6FF" : "2px solid transparent",
                      borderRadius: 10,
                      padding: "10px 12px",
                      cursor: "pointer",
                      display: "flex",
                      alignItems: "center",
                      gap: 10,
                      textAlign: "left",
                      transition: "all 0.15s",
                    }}
                  >
                    <span style={{ fontSize: 20, flex: "0 0 auto" }}>{opt.emoji}</span>
                    <span style={{ display: "flex", flexDirection: "column", gap: 2 }}>
                      <span style={{
                        fontFamily: "'DM Sans', sans-serif",
                        fontSize: 13,
                        fontWeight: 600,
                        color: selected ? "#E6EDF3" : "#C9D1D9",
                      }}>{opt.label}</span>
                      <span style={{
                        fontFamily: "'DM Sans', sans-serif",
                        fontSize: 11,
                        lineHeight: 1.3,
                        color: selected ? "#B7C2CC" : "#565E68",
                      }}>{opt.desc}</span>
                    </span>
                  </button>
                );
              })}
            </div>
          </div>

          <div style={{ marginBottom: 20 }}>
            <div style={{
              fontFamily: "'DM Sans', sans-serif",
              fontSize: 11,
              color: "#8B949E",
              marginBottom: 8,
              textTransform: "uppercase",
              letterSpacing: "0.08em",
            }}>
              Body <span style={{ textTransform: "none", fontWeight: 400, opacity: 0.6 }}>(tap all that apply)</span>
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
              {BODY_TAGS.filter(t => t.value !== "acne").map(tag => {
                const selected = (current.body || []).includes(tag.value);
                return (
                  <button
                    key={tag.value}
                    onClick={() => toggleBody(tag.value)}
                    style={{
                      background: selected ? "#F4A26133" : "#161B22",
                      border: selected ? "2px solid #F4A261" : "2px solid transparent",
                      borderRadius: 20,
                      padding: "8px 14px",
                      cursor: "pointer",
                      display: "flex",
                      alignItems: "center",
                      gap: 6,
                      transition: "all 0.15s",
                    }}
                  >
                    <span style={{ fontSize: 14 }}>{tag.emoji}</span>
                    <span style={{
                      fontFamily: "'DM Sans', sans-serif",
                      fontSize: 11,
                      color: selected ? "#E6EDF3" : "#484F58",
                    }}>{tag.label}</span>
                  </button>
                );
              })}
            </div>
          </div>

          <div style={{ marginBottom: 20 }}>
            <div style={{
              fontFamily: "'DM Sans', sans-serif",
              fontSize: 11,
              color: "#8B949E",
              marginBottom: 8,
              textTransform: "uppercase",
              letterSpacing: "0.08em",
            }}>
              Skin <span style={{ textTransform: "none", fontWeight: 400, opacity: 0.6 }}>(tap all that apply)</span>
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
              {SKIN_TAGS.map(tag => {
                const selected = (current.skin || []).includes(tag.value);
                return (
                  <button
                    key={tag.value}
                    onClick={() => toggleSkin(tag.value)}
                    style={{
                      background: selected ? "#E06B7433" : "#161B22",
                      border: selected ? "2px solid #E06B74" : "2px solid transparent",
                      borderRadius: 20,
                      padding: "8px 14px",
                      cursor: "pointer",
                      display: "flex",
                      alignItems: "center",
                      gap: 6,
                      transition: "all 0.15s",
                    }}
                  >
                    <span style={{ fontSize: 14 }}>{tag.emoji}</span>
                    <span style={{
                      fontFamily: "'DM Sans', sans-serif",
                      fontSize: 11,
                      color: selected ? "#E6EDF3" : "#484F58",
                    }}>{tag.label}</span>
                  </button>
                );
              })}
            </div>
          </div>

          <div style={{ marginBottom: 20 }}>
            <div style={{
              fontFamily: "'DM Sans', sans-serif",
              fontSize: 11,
              color: "#8B949E",
              marginBottom: 8,
              textTransform: "uppercase",
              letterSpacing: "0.08em",
            }}>
              Context <span style={{ textTransform: "none", fontWeight: 400, opacity: 0.6 }}>(optional — only if something notable)</span>
            </div>
            <textarea
              placeholder="e.g. tough convo with Dan, great date, travel day..."
              value={current.context || ""}
              onChange={e => updateField("context", e.target.value)}
              rows={2}
              style={{
                width: "100%",
                padding: "10px 12px",
                background: "#161B22",
                border: "1px solid #21262D",
                borderRadius: 10,
                color: "#E6EDF3",
                fontFamily: "'DM Sans', sans-serif",
                fontSize: 13,
                outline: "none",
                resize: "none",
                lineHeight: 1.5,
                boxSizing: "border-box",
              }}
            />
          </div>

          {current.mood && (
            <div style={{
              background: "#161B22",
              borderRadius: 10,
              padding: "12px 16px",
              fontFamily: "'DM Sans', sans-serif",
              fontSize: 12,
              color: "#8B949E",
              display: "flex",
              alignItems: "center",
              gap: 8,
            }}>
              <span style={{ color: "#2D6A4F", fontSize: 14 }}>✓</span>
              <span>Logged for {formatDate(currentDate)}</span>
            </div>
          )}
        </div>
      )}

      {view === "history" && (
        <div style={{ padding: "16px 20px" }}>
          {sortedDates.length === 0 ? (
            <p style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 13, color: "#484F58", textAlign: "center", marginTop: 40 }}>
              No entries yet. Go log your first day!
            </p>
          ) : (
            sortedDates.map(date => {
              const e = entries[date];
              const moodObj = MOOD_OPTIONS.find(m => m.value === e.mood);
              const sleepObj = SLEEP_OPTIONS.find(s => s.value === e.sleep);
              const bodyTags = (e.body || []).map(b => BODY_TAGS.find(t => t.value === b)).filter(Boolean);
              const skinTags = (e.skin || []).map(s => SKIN_TAGS.find(t => t.value === s)).filter(Boolean);
              const hasBleed = e.bleed && e.bleed !== "none";

              return (
                <div
                  key={date}
                  onClick={() => { setCurrentDate(date); setView("log"); }}
                  style={{
                    background: "#161B22",
                    borderRadius: 10,
                    padding: "12px 16px",
                    marginBottom: 6,
                    cursor: "pointer",
                    borderLeft: `3px solid ${moodObj ? moodColor[moodObj.value] : "#21262D"}`,
                    transition: "all 0.15s",
                  }}
                >
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <span style={{
                        fontFamily: "'DM Sans', sans-serif",
                        fontSize: 12,
                        color: "#8B949E",
                        width: 50,
                      }}>
                        {formatDateShort(date)}
                      </span>
                      <span style={{ fontSize: 16 }}>{moodObj?.emoji || "—"}</span>
                      <span style={{ fontSize: 14 }}>{sleepObj?.emoji || ""}</span>
                      {hasBleed && <span style={{ fontSize: 12 }}>🩸</span>}
                      {e.mucus && <span style={{ fontSize: 12 }}>{(MUCUS_OPTIONS.find(m => m.value === e.mucus) || {}).emoji}</span>}
                    </div>
                    <div style={{ display: "flex", gap: 3, flexWrap: "wrap", justifyContent: "flex-end" }}>
                      {bodyTags.slice(0, 4).map(t => (
                        <span key={t.value} style={{ fontSize: 10 }}>{t.emoji}</span>
                      ))}
                      {skinTags.slice(0, 4).map(t => (
                        <span key={"s" + t.value} style={{ fontSize: 10 }}>{t.emoji}</span>
                      ))}
                    </div>
                  </div>
                  {e.context && (
                    <p style={{
                      fontFamily: "'DM Sans', sans-serif",
                      fontSize: 11,
                      color: "#484F58",
                      margin: "6px 0 0 60px",
                      whiteSpace: "nowrap",
                      overflow: "hidden",
                      textOverflow: "ellipsis",
                    }}>
                      {e.context}
                    </p>
                  )}
                </div>
              );
            })
          )}
        </div>
      )}

      {view === "dashboard" && <Dashboard entries={entries} meds={meds} />}

      {view === "meds" && (
        <div style={{ padding: "16px 20px" }}>
          <div style={{
            background: "#161B22",
            borderRadius: 10,
            padding: 16,
            marginBottom: 16,
            border: "1px solid #21262D",
          }}>
            <h3 style={{
              fontFamily: "'Newsreader', Georgia, serif",
              fontSize: 17, fontWeight: 400, color: "#E6EDF3", margin: "0 0 4px",
            }}>Log a medicine change</h3>
            <p style={{
              fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#8B949E",
              margin: "0 0 12px", lineHeight: 1.5,
            }}>Only when something changes: a new med, a stopped med, or a dose change.</p>
            <input
              type="date"
              value={medDate}
              max={getToday()}
              onChange={e => setMedDate(e.target.value)}
              style={{
                width: "100%", minWidth: 0, maxWidth: "100%",
                WebkitAppearance: "none", MozAppearance: "none", appearance: "none",
                display: "block", height: 40,
                padding: "10px 12px", background: "#0A0C10",
                border: "1px solid #21262D", borderRadius: 8, color: "#E6EDF3",
                fontFamily: "'DM Sans', sans-serif", fontSize: 13, outline: "none",
                boxSizing: "border-box", marginBottom: 8,
              }}
            />
            <input
              type="text"
              placeholder="e.g. Wellbutrin 150mg → 300mg"
              value={medNote}
              onChange={e => setMedNote(e.target.value)}
              onKeyDown={e => { if (e.key === "Enter") addMed(); }}
              style={{
                width: "100%", padding: "10px 12px", background: "#0A0C10",
                border: "1px solid #21262D", borderRadius: 8, color: "#E6EDF3",
                fontFamily: "'DM Sans', sans-serif", fontSize: 13, outline: "none",
                boxSizing: "border-box", marginBottom: 10,
              }}
            />
            <button
              onClick={addMed}
              style={{
                width: "100%", padding: "12px", background: "#161B22",
                border: "2px solid #30363D", borderRadius: 10, color: "#E6EDF3",
                fontFamily: "'DM Sans', sans-serif", fontSize: 13, fontWeight: 600, cursor: "pointer",
              }}
            >Add entry</button>
          </div>

          {meds.length === 0 ? (
            <p style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 13, color: "#484F58", textAlign: "center", marginTop: 24 }}>
              No medicine changes logged yet.
            </p>
          ) : (
            [...meds].sort((a, b) => b.date.localeCompare(a.date)).map(m => (
              <div key={m.id} style={{
                background: "#161B22", borderRadius: 10, padding: "12px 16px", marginBottom: 6,
                borderLeft: "3px solid #A371F7", display: "flex",
                justifyContent: "space-between", alignItems: "center", gap: 10,
              }}>
                <div>
                  <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 11, color: "#8B949E", marginBottom: 2 }}>
                    {formatDate(m.date)}
                  </div>
                  <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 13, color: "#E6EDF3" }}>
                    {m.note}
                  </div>
                </div>
                <button
                  onClick={() => removeMed(m.id)}
                  style={{
                    background: "none", border: "none", color: "#484F58", fontSize: 18,
                    cursor: "pointer", padding: "0 4px", flexShrink: 0, lineHeight: 1,
                  }}
                  aria-label="Remove"
                >×</button>
              </div>
            ))
          )}
        </div>
      )}

      {view === "export" && (
        <div style={{ padding: "16px 20px" }}>
          <div style={{
            background: "#161B22",
            borderRadius: 10,
            padding: 20,
            marginBottom: 16,
            border: "1px solid #21262D",
          }}>
            <h3 style={{
              fontFamily: "'Newsreader', Georgia, serif",
              fontSize: 17,
              fontWeight: 400,
              color: "#E6EDF3",
              margin: "0 0 10px",
            }}>
              Back up &amp; share
            </h3>
            <p style={{
              fontFamily: "'DM Sans', sans-serif",
              fontSize: 12,
              color: "#8B949E",
              margin: "0 0 16px",
              lineHeight: 1.6,
            }}>
              JSON keeps every field exactly, and it's the format Claude reads cleanly. Download a file to save it, or copy it to paste into a chat. Both include your meds log.
            </p>
            <button
              onClick={handleDownloadJSON}
              style={{
                width: "100%",
                padding: "14px",
                background: "#1F6FEB22",
                border: "2px solid #388BFD",
                borderRadius: 10,
                color: "#E6EDF3",
                fontFamily: "'DM Sans', sans-serif",
                fontSize: 14,
                fontWeight: 600,
                cursor: "pointer",
                marginBottom: 8,
                transition: "all 0.2s",
              }}
            >
              ⬇ Download backup (.json)
            </button>
            <button
              onClick={handleCopyJSON}
              style={{
                width: "100%",
                padding: "12px",
                background: copiedJSON ? "#2D6A4F" : "#161B22",
                border: `2px solid ${copiedJSON ? "#2D6A4F" : "#30363D"}`,
                borderRadius: 10,
                color: "#E6EDF3",
                fontFamily: "'DM Sans', sans-serif",
                fontSize: 13,
                fontWeight: 600,
                cursor: "pointer",
                marginBottom: 8,
                transition: "all 0.2s",
              }}
            >
              {copiedJSON ? "✓ Copied JSON!" : "Copy JSON to clipboard"}
            </button>
            <button
              onClick={handleCopy}
              style={{
                width: "100%",
                padding: "10px",
                background: "none",
                border: "none",
                color: "#484F58",
                fontFamily: "'DM Sans', sans-serif",
                fontSize: 12,
                cursor: "pointer",
                textDecoration: "underline",
              }}
            >
              {copied ? "✓ Copied readable text" : "Copy readable text instead"}
            </button>
          </div>

          <div style={{
            background: "#161B22",
            borderRadius: 10,
            padding: 16,
            border: "1px solid #21262D",
          }}>
            <div style={{
              fontFamily: "'DM Sans', sans-serif",
              fontSize: 11,
              color: "#484F58",
              marginBottom: 8,
            }}>Preview</div>
            <pre style={{
              fontFamily: "monospace",
              fontSize: 11,
              color: "#7EE787",
              background: "#0A0C10",
              borderRadius: 8,
              padding: 12,
              overflow: "auto",
              maxHeight: 400,
              whiteSpace: "pre-wrap",
              lineHeight: 1.6,
              margin: 0,
            }}>
              {generateExport()}
            </pre>
          </div>

          <div style={{
            background: "#161B22",
            borderRadius: 10,
            padding: 20,
            marginTop: 16,
            border: "1px solid #21262D",
          }}>
            <h3 style={{
              fontFamily: "'Newsreader', Georgia, serif",
              fontSize: 17,
              fontWeight: 400,
              color: "#E6EDF3",
              margin: "0 0 10px",
            }}>
              Restore from backup
            </h3>
            <p style={{
              fontFamily: "'DM Sans', sans-serif",
              fontSize: 12,
              color: "#8B949E",
              margin: "0 0 12px",
              lineHeight: 1.6,
            }}>
              Choose a .json backup file, or paste JSON (or older text) below. New data merges into what's here. This only saves to this device.
            </p>
            <input
              type="file"
              accept="application/json,.json,.txt,text/plain"
              onChange={handleImportFile}
              style={{
                width: "100%",
                fontFamily: "'DM Sans', sans-serif",
                fontSize: 12,
                color: "#8B949E",
                marginBottom: 12,
              }}
            />
            <textarea
              placeholder="…or paste your backup (JSON or text) here"
              value={importText}
              onChange={e => { setImportText(e.target.value); setImportMessage(""); }}
              rows={5}
              style={{
                width: "100%",
                padding: "10px 12px",
                background: "#0A0C10",
                border: "1px solid #21262D",
                borderRadius: 10,
                color: "#E6EDF3",
                fontFamily: "monospace",
                fontSize: 11,
                outline: "none",
                resize: "vertical",
                lineHeight: 1.5,
                boxSizing: "border-box",
                marginBottom: 10,
              }}
            />
            <button
              onClick={handleImport}
              style={{
                width: "100%",
                padding: "12px",
                background: "#161B22",
                border: "2px solid #30363D",
                borderRadius: 10,
                color: "#E6EDF3",
                fontFamily: "'DM Sans', sans-serif",
                fontSize: 13,
                fontWeight: 600,
                cursor: "pointer",
              }}
            >
              Import entries
            </button>
            {importMessage && (
              <p style={{
                fontFamily: "'DM Sans', sans-serif",
                fontSize: 11,
                color: importMessage.startsWith("Imported") ? "#2D6A4F" : "#F47067",
                marginTop: 8,
                marginBottom: 0,
              }}>{importMessage}</p>
            )}
          </div>

          <div style={{ marginTop: 24, textAlign: "center" }}>
            <button
              onClick={async () => {
                if (confirm("Clear all entries and meds? This can't be undone.")) {
                  setEntries({});
                  setMeds([]);
                  try {
                    await window.storage.delete(STORAGE_KEY);
                    await window.storage.delete(MEDS_KEY);
                  } catch (e) {}
                }
              }}
              style={{
                background: "none",
                border: "none",
                fontFamily: "'DM Sans', sans-serif",
                fontSize: 11,
                color: "#484F58",
                cursor: "pointer",
                textDecoration: "underline",
              }}
            >
              Reset all data
            </button>
          </div>
        </div>
      )}

      <style>{`
        input::placeholder, textarea::placeholder {
          color: #30363D;
        }
      `}</style>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<CycleTracker />);
</script>

</body>
</html>
