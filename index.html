<script>
  // ---- localStorage-backed shim for window.storage (same interface the app already used in Claude) ----
  // No personal data is stored in this file. Everything lives only in this browser's local storage,
  // added either by using the app day-to-day, or via the "Restore from backup" paste box inside it.
  window.storage = {
    get: async (key) => {
      const v = localStorage.getItem(key);
      if (v === null) return null;
      return { key, value: v, shared: false };
    },
    set: async (key, value) => {
      localStorage.setItem(key, value);
      return { key, value, shared: false };
    },
    delete: async (key) => {
      localStorage.removeItem(key);
      return { key, deleted: true, shared: false };
    },
    list: async (prefix) => {
      const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
      return { keys };
    },
  };
</script>

function getToday() {
  const d = new Date();
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function formatDate(dateStr) {
  const d = new Date(dateStr + "T12:00:00");
  return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
}

// ---- Read-time migration + phase helpers (nothing rewritten in storage) ----
// Breast tenderness: new full/sore split. Legacy "boobs-tender" reads as "full".
function breastState(e) {
  const body = (e && e.body) || [];
  if (body.includes("boobs-sore")) return "sore";
  if (body.includes("boobs-full")) return "full";
  if (body.includes("boobs-tender")) return "full"; // legacy days
  return null;
}
function breastIsLegacy(e) {
  const body = (e && e.body) || [];
  return !body.includes("boobs-sore") && !body.includes("boobs-full") && body.includes("boobs-tender");
}
function hasBreastTenderness(e) { return breastState(e) !== null; }
// Skin signal the phase estimate uses: jawline/chin OR cystic.
function skinFlag(e) {
  const skin = (e && e.skin) || [];
  return skin.includes("jawline") || skin.includes("cystic");
}

function shiftStr(dateStr, days) {
  const d = new Date(dateStr + "T12:00:00");
  d.setDate(d.getDate() + days);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function daysBetweenStr(a, b) {
  return Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 86400000);
}

// Phase estimate: evaluated top-down, first match wins.
// daysSinceEgg (optional): days since the last egg white BEFORE this day. Egg-white tiebreaker:
// if it's been 1-10 days and the day would otherwise read follicular / approaching / unclear, lean early luteal.
function estimatePhase({ mucus, breasts, skinF, released, breastsLegacy, daysSinceEgg }) {
  let r;
  if (mucus === "eggwhite") r = { phase: "Fertile window", key: "fertile", conf: "High", why: "🥚 Egg white today." };
  else if (released) r = { phase: "Cycle restart", key: "restart", conf: "High", why: "Breast tenderness just dropped off (the release)." };
  else if (breasts === "sore" && skinF) r = { phase: "Late luteal", key: "late", conf: breastsLegacy ? "Medium" : "High", why: "🍉 Sore breasts plus jawline or cystic skin." };
  else if (breasts === "full" && (mucus === "dry" || mucus === "sticky")) r = { phase: "Early luteal", key: "early", conf: "Medium", why: "🍈🍈 Full breasts with dry or sticky mucus." };
  else if (mucus === "creamy" && breasts !== "sore") r = { phase: "Approaching fertile", key: "approaching", conf: "Medium", why: "🥛 Creamy mucus, no sore breasts." };
  else if ((mucus === "dry" || mucus === "sticky") && !breasts && !skinF) r = { phase: "Follicular", key: "follicular", conf: "Medium", why: "Dry or sticky mucus, no breast or skin signals." };
  else r = { phase: "Unclear", key: "unclear", conf: "Low", why: "Not enough of the key signals logged this day." };
  if (daysSinceEgg != null && daysSinceEgg >= 1 && daysSinceEgg <= 10 && ["follicular", "approaching", "unclear"].includes(r.key)) {
    r = { phase: "Early luteal", key: "early", conf: "Medium", why: `${daysSinceEgg} ${daysSinceEgg === 1 ? "day" : "days"} since your last 🥚 egg white, so it leans early luteal (tiebreaker).` };
  }
  return r;
}

// Everything the rules need for one day, read from history as of that day (never peeks ahead).
function signalsForDate(entries, d) {
  const e = entries[d] || {};
  const breasts = breastState(e);
  const released = (() => {
    if (breasts || !entries[d]) return false;
    for (let b = 1; b <= 3; b++) { const p = shiftStr(d, -b); if (entries[p] && hasBreastTenderness(entries[p])) return true; }
    return false;
  })();
  const keys = Object.keys(entries).filter(k => k <= d).sort();
  const lastEggBefore = [...keys].reverse().find(k => k < d && entries[k].mucus === "eggwhite");
  const lastEggAny = [...keys].reverse().find(k => entries[k].mucus === "eggwhite");
  const isReleaseDay = (x) => {
    if (!entries[x] || hasBreastTenderness(entries[x])) return false;
    for (let b = 1; b <= 3; b++) { const p = shiftStr(x, -b); if (entries[p] && hasBreastTenderness(entries[p])) return true; }
    return false;
  };
  const lastRelease = [...keys].reverse().find(isReleaseDay);
  return {
    entry: e,
    logged: !!entries[d],
    mucus: e.mucus || null,
    breasts,
    breastsLegacy: breastIsLegacy(e),
    skinF: skinFlag(e),
    released,
    daysSinceEggBefore: lastEggBefore ? daysBetweenStr(lastEggBefore, d) : null,
    daysSinceEgg: lastEggAny ? daysBetweenStr(lastEggAny, d) : null,
    daysSinceRelease: lastRelease ? daysBetweenStr(lastRelease, d) : null,
  };
}

function rulesForDate(entries, d) {
  const s = signalsForDate(entries, d);
  return estimatePhase({ mucus: s.mucus, breasts: s.breasts, skinF: s.skinF, released: s.released, breastsLegacy: s.breastsLegacy, daysSinceEgg: s.daysSinceEggBefore });
}

// ---- Deep read (Claude API, called straight from this page) ----
// The API key lives only in this phone's browser storage. It is never in this file, the repo, or a backup.
const API_KEY_KEY = "cycle-tracker-anthropic-key";
const DEEP_KEY = "cycle-tracker-deepreads";
const DEEP_MODEL = "claude-haiku-5-5";
const DEEP_PRICE = { in: 0.10, out: 0.50 }; // USD per million tokens, Haiku 5.5 (prompts under 100K)
const PHASE_KEYS = { "Cycle restart": "restart", "Follicular": "follicular", "Approaching fertile": "approaching", "Fertile window": "fertile", "Early luteal": "early", "Late luteal": "late", "Unclear": "unclear" };

function lsGet(k, fallback) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch { return fallback; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function getApiKey() { try { return localStorage.getItem(API_KEY_KEY) || ""; } catch { return ""; } }

// 90 days ending on the target day, relative day numbers only. No dates, no context notes.
function buildDeepPayload(entries, meds, d) {
  const days = [];
  for (let n = 89; n >= 0; n--) {
    const k = shiftStr(d, -n);
    const e = entries[k];
    if (!e) continue;
    const row = { day: -n };
    if (e.mood) row.mood = e.mood === "orange" ? "yellow" : e.mood;
    if (e.sleep) row.sleep = e.sleep;
    if (e.sleepTime) row.wokeAt = e.sleepTime;
    if (e.bleed && e.bleed !== "none") row.bleed = e.bleed;
    if (e.mucus) row.mucus = e.mucus;
    const bs = breastState(e);
    const body = (e.body || []).filter(t => !["boobs-full", "boobs-sore", "boobs-tender"].includes(t));
    if (bs) body.push("breasts-" + bs);
    if (body.length) row.body = body;
    if ((e.skin || []).length) row.skin = e.skin;
    days.push(row);
  }
  const medChanges = (meds || []).filter(m => m.date <= d && daysBetweenStr(m.date, d) <= 89)
    .map(m => ({ day: -daysBetweenStr(m.date, d), change: m.note }));
  return { days, medChanges };
}

const DEEP_SYSTEM = `You help one person estimate where she is in her menstrual cycle. She has a hormonal IUD, so bleeding is light, irregular, or absent and is a weak signal. Most people still ovulate on a hormonal IUD.

You get up to 90 days of her daily log. Days are numbered relative to the day being assessed: day 0 is that day, day -1 the day before, and so on. Days she didn't log are missing.

Signal strength, strongest first:
1. Cervical mucus: dry, sticky, creamy, eggwhite. Egg white marks the fertile window; the last egg-white day is the best anchor. Ovulation is usually near it, and the luteal phase lasts roughly 12 to 16 days after.
2. Breasts: breasts-full (early luteal, sometimes briefly near ovulation) and breasts-sore (late luteal peak). When tenderness drops off for a day after being present (the "release"), a new cycle is starting, bleed or no bleed.
3. Skin: cystic and jawline acne cluster late luteal; oily skin shows early luteal.
Weaker: energy (high-energy follicular and fertile; low-energy early luteal for 2-3 days and late luteal), snacky, bloated, cramping (luteal, especially late), mood, sleep. Spotting mid-cycle is noise on a hormonal IUD. Tretinoin and extractions are treatments, not signals.

Phases she uses (typical cycle days): Cycle restart (1-5), Follicular (6-11), Approaching fertile (creamy mucus building toward egg white), Fertile window (12-16), Early luteal (17-22), Late luteal (23+). Use Unclear only when the history truly can't place her.

Look for her own repeating patterns across cycles in the 90 days, not just textbook ones. Weigh the whole recent history; one thin day should not override a clear anchor. Med changes can shift mood and sleep, so discount those for a couple of weeks after one.

A simple rule engine also made a guess from day 0 alone; it's given for comparison. Say whether you agree.

Respond only by calling report_phase. Keep reasoning to 2-3 short, plain sentences that name the specific days or signals you relied on (e.g. "egg white on day -8"). No medical advice.`;

const DEEP_TOOL = {
  name: "report_phase",
  description: "Report the estimated cycle phase for day 0.",
  input_schema: {
    type: "object",
    properties: {
      phase: { type: "string", enum: Object.keys(PHASE_KEYS) },
      confidence: { type: "string", enum: ["High", "Medium", "Low"] },
      cycle_day: { type: "integer", description: "Best guess of cycle day for day 0. Use 0 if it can't be estimated." },
      reasoning: { type: "string", description: "2-3 short plain sentences naming the signals and relative days used." },
      agrees_with_rules: { type: "boolean" },
      watch_for: { type: "string", description: "One short line: the next signal that would confirm or change this estimate." },
    },
    required: ["phase", "confidence", "cycle_day", "reasoning", "agrees_with_rules", "watch_for"],
  },
};

async function runDeepRead(entries, meds, d) {
  const key = getApiKey();
  if (!key) throw new Error("NO_KEY");
  const rules = rulesForDate(entries, d);
  const payload = buildDeepPayload(entries, meds, d);
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: DEEP_MODEL,
      max_tokens: 700,
      system: DEEP_SYSTEM,
      tools: [DEEP_TOOL],
      tool_choice: { type: "tool", name: "report_phase" },
      messages: [{ role: "user", content: "Rule engine's guess for day 0: " + rules.phase + " (" + rules.conf + ").\n\nLog:\n" + JSON.stringify(payload) }],
    }),
  });
  let data = null;
  try { data = await res.json(); } catch {}
  if (!res.ok) {
    const msg = (data && data.error && data.error.message) || "";
    if (res.status === 401) throw new Error("BAD_KEY");
    if (/usage limits/i.test(msg) || /credit balance/i.test(msg)) throw new Error("CAP");
    throw new Error("API " + res.status + (msg ? ": " + msg : ""));
  }
  const block = (data.content || []).find(c => c.type === "tool_use");
  if (!block) throw new Error("No answer came back. Try again.");
  const out = block.input;
  return {
    phase: out.phase, key: PHASE_KEYS[out.phase] || "unclear", conf: out.confidence,
    cycleDay: out.cycle_day, reasoning: out.reasoning, agrees: out.agrees_with_rules, watchFor: out.watch_for,
    rulesPhase: rules.phase, at: new Date().toISOString(), model: DEEP_MODEL,
    inTok: (data.usage && data.usage.input_tokens) || 0, outTok: (data.usage && data.usage.output_tokens) || 0,
    daysSent: payload.days.length,
  };
}

function Dashboard({ entries, meds }) {
  const [sel, setSel] = useState(null);
  const [mIdx, setMIdx] = useState(null); // which month the calendar shows; null = latest
  const [showMore, setShowMore] = useState(false);

  const MOODC = { green: "#2E9E6A", yellow: "#E9C46A", red: "#C1121F" };
  const MOODL = { green: "Good", yellow: "Meh", red: "Bad" };
  const mkey = (m) => (m === "orange" ? "yellow" : m); // old "rough" now renders as yellow
  const SLEEPL = { solid: "Solid", ok: "Ok", "woke-early": "Woke early", awful: "Awful" };
  const BLEEDL = { spotting: "spotting", light: "light", heavier: "heavier" };
  const BLEEDI = { spotting: 1, light: 2, heavier: 3 };
  const MUCUSV = {
    dry: { dot: null, label: "Dry" },
    sticky: { dot: "#4E6E8E", label: "Sticky" },
    creamy: { dot: "#5A93C9", label: "Creamy" },

  };
  const BODYL = {};
  BODY_TAGS.forEach(t => { BODYL[t.value] = t.emoji + " " + t.label; });
  const SKINL = {};
  SKIN_TAGS.forEach(t => { SKINL[t.value] = t.emoji + " " + t.label; });
  // Unify new skin field with legacy body "acne" so old history still shows.
  const acneState = (e) => {
    const skin = e.skin || [];
    if (skin.includes("cystic")) return "cystic";
    if (skin.includes("regular") || (e.body || []).includes("acne")) return "regular";

  };

  const medList = meds || [];
  const medDates = new Set(medList.map(m => m.date));
  const keys = Object.keys(entries).sort();

  const parseD = (s) => new Date(s + "T12:00:00");
  const dbetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);
  const fmtS = (s) => parseD(s).toLocaleDateString("en-US", { month: "short", day: "numeric" });
  const fmtL = (s) => parseD(s).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  const dstr = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;

  if (keys.length === 0) {
    return (
      <div style={{ padding: "48px 24px", textAlign: "center", fontFamily: "'DM Sans', sans-serif", fontSize: 13, color: "#484F58", lineHeight: 1.6 }}>
        Log a few days first, then your dashboard fills in here — a calendar, your bleeding rhythm, and medicine markers.
      </div>
    );
  }

  const total = keys.length;
  const span = dbetween(keys[0], keys[keys.length - 1]) + 1;
  const bleedDays = keys.filter(k => entries[k].bleed && entries[k].bleed !== "none").length;

  // months
  const first = parseD(keys[0]), last = parseD(keys[keys.length - 1]);
  const months = [];
  let yy = first.getFullYear(), mm = first.getMonth();
  const eY = last.getFullYear(), eM = last.getMonth();
  while (yy < eY || (yy === eY && mm <= eM)) { months.push([yy, mm]); mm++; if (mm > 11) { mm = 0; yy++; } }

  // bleed episodes
  const bleedDatesArr = keys.filter(k => entries[k].bleed && entries[k].bleed !== "none");
  const episodes = [];
  let cur = null;
  bleedDatesArr.forEach(d => {
    if (cur && dbetween(cur.end, d) <= 2) { cur.end = d; cur.days.push(d); cur.maxI = Math.max(cur.maxI, BLEEDI[entries[d].bleed] || 1); }
    else { cur = { start: d, end: d, days: [d], maxI: BLEEDI[entries[d].bleed] || 1 }; episodes.push(cur); }
  });
  const tenderBefore = (start) => {
    for (let b = 1; b <= 5; b++) { const ds = dstr(new Date(parseD(start).getTime() - b * 86400000)); if (entries[ds] && hasBreastTenderness(entries[ds])) return true; }
    return false;
  };
  const preTally = {}; let tenderCount = 0;
  episodes.forEach(ep => {
    const seen = new Set();
    for (let b = 1; b <= 5; b++) { const ds = dstr(new Date(parseD(ep.start).getTime() - b * 86400000)); if (entries[ds]) (entries[ds].body || []).forEach(t => seen.add(t)); }
    if (seen.has("boobs-tender") || seen.has("boobs-full") || seen.has("boobs-sore")) tenderCount++;
    seen.forEach(t => preTally[t] = (preTally[t] || 0) + 1);
  });
  const preTop = Object.entries(preTally).sort((a, b) => b[1] - a[1]).slice(0, 3);

  const dow = ["S", "M", "T", "W", "T", "F", "S"];
  const selE = sel ? entries[sel] : null;

  return (
    <div className="dash">
      <style>{`

// Cycle strip: day 1 to 28+ split into the five phases. Rules light the segment; a deep read adds a day marker.
const STRIP = [
  { key: "restart", label: "Restart", from: 1, to: 5 },
  { key: "follicular", label: "Follic.", from: 6, to: 11 },
  { key: "fertile", label: "Fertile", from: 12, to: 16 },
  { key: "early", label: "Early lut.", from: 17, to: 22 },
  { key: "late", label: "Late lut.", from: 23, to: 29 },
];
const STRIP_TOTAL = 29;
const STRIP_NAMES = { restart: "Cycle restart", follicular: "Follicular", fertile: "Fertile window", early: "Early luteal", late: "Late luteal" };

function CycleStrip({ phaseKey, cycleDay, deep }) {
  const lit = phaseKey === "approaching" ? "follicular" : phaseKey;
  const accent = deep ? "#A371F7" : "#6CB6FF";
  const day = deep && cycleDay > 0 ? Math.min(cycleDay, STRIP_TOTAL) : null;
  const pos = day ? ((day - 0.5) / STRIP_TOTAL) * 100 : null;
  const seg = day ? STRIP.find(s => day >= s.from && day <= s.to) : null;
  const segIdx = seg ? STRIP.indexOf(seg) : -1;
  const next = segIdx >= 0 ? STRIP[(segIdx + 1) % STRIP.length] : null;
  const daysLeft = seg && seg.key !== "late" ? seg.to - cycleDay + 1 : null;
  const jump = (i) => { const c = document.querySelectorAll(".sig .s-card")[i]; if (c) c.scrollIntoView({ behavior: "smooth", block: "center" }); };
  return (
    <div style={{ margin: "16px 0 4px" }}>
      <div style={{ position: "relative", paddingTop: day ? 20 : 0 }}>
        {day && (
          <>
            <div style={{ position: "absolute", top: 0, left: `calc(${pos}% - 30px)`, width: 60, textAlign: "center", fontFamily: "'DM Sans', sans-serif", fontSize: 11, fontWeight: 600, color: accent }}>day {cycleDay}</div>
            <div style={{ position: "absolute", top: 15, left: `calc(${pos}% - 1px)`, width: 2, height: 40, background: accent, zIndex: 1, borderRadius: 1 }} />
          </>
        )}
        <div style={{ display: "flex", gap: 3, height: 30 }}>
          {STRIP.map((s, i) => {
            const on = s.key === lit;
            return (
              <button key={s.key} onClick={() => jump(i)} aria-label={STRIP_NAMES[s.key]} style={{
                flex: s.to - s.from + 1, border: on ? `1.5px solid ${accent}` : "1px solid #21262D", borderRadius: 6,
                background: on ? accent + "33" : "#161B22", color: on ? "#E6EDF3" : "#565E68",
                fontFamily: "'DM Sans', sans-serif", fontSize: 10, fontWeight: on ? 600 : 400, padding: 0, cursor: "pointer",
                whiteSpace: "nowrap", overflow: "hidden",
              }}>{s.label}</button>
            );
          })}
        </div>
      </div>
      <div style={{ display: "flex", fontFamily: "'DM Sans', sans-serif", fontSize: 10, color: "#565E68", marginTop: 4 }}>
        {STRIP.map(s => <span key={s.key} style={{ flex: s.to - s.from + 1, textAlign: "left" }}>{s.key === "late" ? "23+" : s.from}</span>)}
      </div>
      {day && next && daysLeft !== null && daysLeft > 0 && (
        <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#8B949E", marginTop: 8 }}>About {daysLeft} {daysLeft === 1 ? "day" : "days"} until {STRIP_NAMES[next.key].toLowerCase()}</div>
      )}
      {!day && lit !== "unclear" && (
        <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 11, color: "#565E68", marginTop: 8 }}>Rules can't count days. A deep read adds a day marker.</div>
      )}
    </div>
  );
}

function Signals({ entries, meds, date, setDate }) {
  const [showWhy, setShowWhy] = useState(false);
  const [showSetup, setShowSetup] = useState(false);
  const [reads, setReads] = useState(() => lsGet(DEEP_KEY, {}));
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [hasKey, setHasKey] = useState(() => !!getApiKey());
  const [keyInput, setKeyInput] = useState("");

  useEffect(() => { setErr(""); }, [date]);

  const s = signalsForDate(entries, date);
  const rules = rulesForDate(entries, date);
  const deep = reads[date] || null;
  const cur = deep || rules;

  const CONF = { High: "#2E9E6A", Medium: "#E9C46A", Low: "#6E7681" };

  const ask = async () => {
    if (!getApiKey()) { setShowSetup(true); setErr("Add your API key below first."); return; }
    setBusy(true); setErr("");
    try {
      const r = await runDeepRead(entries, meds, date);
      const next = { ...lsGet(DEEP_KEY, {}), [date]: r };
      lsSet(DEEP_KEY, next);
      setReads(next);
    } catch (e) {
      const m = e.message || String(e);
      if (m === "NO_KEY") { setShowSetup(true); setErr("Add your API key below first."); }
      else if (m === "BAD_KEY") setErr("That API key didn't work. Check it in Deep read setup below.");
      else if (m === "CAP") setErr("Your monthly API limit or credit balance is used up. The rules estimate still works.");
      else if (/Failed to fetch|NetworkError|Load failed/i.test(m)) setErr("Couldn't reach Claude. Check your connection and try again.");
      else setErr(m);
    }
    setBusy(false);
  };

  const saveKey = () => {
    const k = keyInput.trim();
    if (!k) return;
    try { localStorage.setItem(API_KEY_KEY, k); } catch {}
    setKeyInput(""); setHasKey(true); setErr("");
  };
  const removeKey = () => {
    if (!confirm("Remove the API key from this phone?")) return;
    try { localStorage.removeItem(API_KEY_KEY); } catch {}
    setHasKey(false);
  };
  const keyTail = (() => { const k = getApiKey(); return k ? k.slice(-4) : ""; })();

  // Cost line: reads made this calendar month, from the token counts Anthropic sends back.
  const ym = getToday().slice(0, 7);
  const monthReads = Object.values(reads).filter(r => r && r.at && (() => { const t = new Date(r.at); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}` === ym; })());
  const monthCost = monthReads.reduce((sum, r) => sum + (r.inTok || 0) * DEEP_PRICE.in / 1e6 + (r.outTok || 0) * DEEP_PRICE.out / 1e6, 0);
  const fmtCost = (c) => c < 0.01 ? "under 1¢" : c < 1 ? `${(c * 100).toFixed(1)}¢` : `$${c.toFixed(2)}`;

  // What you logged this day, in the Log's own emoji.

function CycleTracker() {
  const [entries, setEntries] = useState({});
  const [meds, setMeds] = useState([]);
  const [currentDate, setCurrentDate] = useState(getToday());
  const [view, setView] = useState("log"); // log | history | meds | export
  const [saved, setSaved] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [copied, setCopied] = useState(false);
  const [copiedJSON, setCopiedJSON] = useState(false);
  const [importText, setImportText] = useState("");
  const [importMessage, setImportMessage] = useState("");
  const [medDate, setMedDate] = useState(getToday());
  const [medNote, setMedNote] = useState("");

  // Load from persistent storage
  useEffect(() => {
    async function load() {
      try {
        const result = await window.storage.get(STORAGE_KEY);
        if (result && result.value) {
          setEntries(JSON.parse(result.value));
        }
      } catch (e) {
        // No data yet, that's fine
      }
      try {
        const medResult = await window.storage.get(MEDS_KEY);
        if (medResult && medResult.value) {
          setMeds(JSON.parse(medResult.value));
        }
      } catch (e) {
        // No meds yet, that's fine
      }
      setLoaded(true);
    }
    load();
  }, []);

  // Save to persistent storage
  const saveEntries = useCallback(async (newEntries) => {
    setEntries(newEntries);
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify(newEntries));
      setSaved(true);
      setTimeout(() => setSaved(false), 1500);
    } catch (e) {
      console.error("Save failed:", e);
    }
  }, []);

  // Save meds to persistent storage
  const saveMeds = useCallback(async (newMeds) => {
    setMeds(newMeds);
    try {
      await window.storage.set(MEDS_KEY, JSON.stringify(newMeds));
      setSaved(true);
      setTimeout(() => setSaved(false), 1500);
    } catch (e) {
      console.error("Save failed:", e);
    }
  }, []);

  const addMed = () => {
    if (!medNote.trim()) return;
    const entry = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      date: medDate,
      note: medNote.trim(),
    };
    saveMeds([...meds, entry]);
    setMedNote("");
    setMedDate(getToday());
  };

  const removeMed = (id) => {
    if (confirm("Remove this medicine entry?")) {
      saveMeds(meds.filter(m => m.id !== id));
    }
  };

  const current = entries[currentDate] || {
    mood: null,
    sleep: null,
    sleepTime: "",
    bleed: "none",
    mucus: null,
    body: [],
    skin: [],
    context: "",
  };

  const updateField = (field, value) => {
    const updated = {
      ...entries,
      [currentDate]: { ...current, [field]: value },
    };
    saveEntries(updated);
  };

  const toggleBody = (tag) => {
    const body = current.body || [];
    let updated;
    if (body.includes(tag)) {
      updated = body.filter(t => t !== tag);
    } else {
      updated = [...body, tag];
      // Boobs full / sore are mutually exclusive — picking one clears the other.
      if (tag === "boobs-full") updated = updated.filter(t => t !== "boobs-sore");
      if (tag === "boobs-sore") updated = updated.filter(t => t !== "boobs-full");
    }
    updateField("body", updated);
  };

  const toggleSkin = (tag) => {
    const skin = current.skin || [];
    const updated = skin.includes(tag)
      ? skin.filter(t => t !== tag)
      : [...skin, tag];
    updateField("skin", updated);
  };

  // Navigate dates
  const shiftDate = (days) => {
    const d = new Date(currentDate + "T12:00:00");
    d.setDate(d.getDate() + days);
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    const newDate = `${year}-${month}-${day}`;
    if (newDate <= getToday()) setCurrentDate(newDate);
  };

  // Generate export text
  const generateExport = () => {
    const sorted = Object.keys(entries).sort();
    if (sorted.length === 0) return "No entries yet!";
    let text = "";
    sorted.forEach(date => {
      const e = entries[date];
      const moodObj = MOOD_OPTIONS.find(m => m.value === e.mood);
      const sleepObj = SLEEP_OPTIONS.find(s => s.value === e.sleep);
      const bleedObj = BLEED_OPTIONS.find(b => b.value === e.bleed);
      const bodyTags = (e.body || []).map(b => {
        const tag = BODY_TAGS.find(t => t.value === b);
        return tag ? tag.emoji + " " + tag.label.toLowerCase() : b;
      });

      text += `${formatDate(date)}\n`;
      text += `mood: ${moodObj ? moodObj.emoji : "—"}\n`;
      text += `sleep: ${sleepObj ? sleepObj.emoji + " " + sleepObj.label.toLowerCase() : "—"}${e.sleepTime ? " " + e.sleepTime : ""}\n`;
      if (e.bleed && e.bleed !== "none") {
        text += `bleed: ${bleedObj ? bleedObj.emoji + " " + bleedObj.label.toLowerCase() : e.bleed}\n`;
      }
      if (e.mucus) {
        const mObj = MUCUS_OPTIONS.find(m => m.value === e.mucus);
        text += `mucus: ${mObj ? mObj.emoji + " " + mObj.label.toLowerCase() : e.mucus}\n`;
      }
      if (bodyTags.length > 0) {
        text += `body: ${bodyTags.join(", ")}\n`;
      }
      const skinTags = (e.skin || []).map(s => {
        const t = SKIN_TAGS.find(x => x.value === s);
        return t ? t.emoji + " " + t.label.toLowerCase() : s;
      });
      if (skinTags.length > 0) {
        text += `skin: ${skinTags.join(", ")}\n`;
      }
      if (e.context && e.context.trim()) {
        text += `context: ${e.context.trim()}\n`;
      }
      text += "\n";
    });
    if (meds && meds.length > 0) {
      text += "\n--- medicine changes ---\n";
      [...meds].sort((a, b) => a.date.localeCompare(b.date)).forEach(m => {
        text += `${formatDate(m.date)}: ${m.note}\n`;

    return text.trim();
  };

  // Full JSON export: lossless, includes daily entries + meds log
  const generateJSON = () => {
    return JSON.stringify({
      app: "cycle-check",

  const handleDownloadJSON = () => {

  const handleCopyJSON = async () => {

      await navigator.clipboard.writeText(text);

  const handleCopy = async () => {

  const parseImportText = (text) => {
    const monthMap = { Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5, Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11 };
    const blocks = text.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
    const result = { ...entries };
    let count = 0;

    blocks.forEach(block => {
      const lines = block.split("\n").filter(l => l.trim().length > 0);
      if (lines.length === 0) return;
      const dateMatch = lines[0].match(/(\w+),\s*(\w+)\s+(\d+)/);
      if (!dateMatch || !(dateMatch[2] in monthMap)) return;
      const month = monthMap[dateMatch[2]];
      const day = parseInt(dateMatch[3], 10);

      const now = new Date();
      let year = now.getFullYear();
      if (new Date(year, month, day) > now) year -= 1;
      const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;

      const entry = { mood: null, sleep: null, sleepTime: "", bleed: "none", mucus: null, body: [], skin: [], context: "" };
      const contextLines = [];
      let inContext = false;

      for (let i = 1; i < lines.length; i++) {
        const line = lines[i];
        if (line.startsWith("mood:")) {
          inContext = false;
          const val = line.slice(5).trim();
          const m = MOOD_OPTIONS.find(o => val.startsWith(o.emoji));
          entry.mood = m ? m.value : null;
        } else if (line.startsWith("sleep:")) {
          inContext = false;
          const rest = line.slice(6).trim();
          if (!rest || rest.startsWith("—")) {
            entry.sleep = null;
          } else {
            const s = SLEEP_OPTIONS.find(o => rest.startsWith(o.emoji));
            entry.sleep = s ? s.value : null;
            if (s) {
              let trailing = rest.slice(s.emoji.length).trim();
              if (trailing.toLowerCase().startsWith(s.label.toLowerCase())) {
                trailing = trailing.slice(s.label.length).trim();
              }
              if (trailing) entry.sleepTime = trailing;
            }
          }
        } else if (line.startsWith("bleed:")) {
          inContext = false;
          const rest = line.slice(6).trim();
          const b = BLEED_OPTIONS.find(o => o.value !== "none" && rest.startsWith(o.emoji));
          entry.bleed = b ? b.value : "none";
        } else if (line.startsWith("mucus:")) {
          inContext = false;
          const rest = line.slice(6).trim();
          const m = MUCUS_OPTIONS.find(o => rest.startsWith(o.emoji));
          entry.mucus = m ? m.value : null;
        } else if (line.startsWith("body:")) {
          inContext = false;
          const rest = line.slice(5).trim();
          entry.body = rest.split(",").map(t => t.trim()).map(t => {
            const found = BODY_TAGS.find(tag => t.startsWith(tag.emoji));
            return found ? found.value : null;
          }).filter(Boolean);
        } else if (line.startsWith("skin:")) {
          inContext = false;
          const rest = line.slice(5).trim();
          entry.skin = rest.split(",").map(t => t.trim()).map(t => {
            const found = SKIN_TAGS.find(tag => t.startsWith(tag.emoji));
            return found ? found.value : null;
          }).filter(Boolean);
        } else if (line.startsWith("context:")) {
          inContext = true;
          contextLines.push(line.slice(8).trim());
        } else if (inContext) {
          contextLines.push(line.trim());
        }
      }
      entry.context = contextLines.join(" ").trim();
      result[dateStr] = entry;
      count++;
    });

    return { result, count };
  };

  // Accepts JSON (preferred, lossless) or the older readable text. Merges into current data.
  const applyImport = (text) => {
    const trimmed = (text || "").trim();
    if (trimmed.startsWith("{")) {
      try {
        const data = JSON.parse(trimmed);
        const newEntries = data.entries && typeof data.entries === "object"
          ? { ...entries, ...data.entries }
          : entries;
        let medCount = 0;
        if (Array.isArray(data.meds)) {
          const existingIds = new Set(meds.map(m => m.id));
          const toAdd = data.meds.filter(m => m && m.id && !existingIds.has(m.id));
          if (toAdd.length > 0) {
            saveMeds([...meds, ...toAdd]);
            medCount = toAdd.length;
          }
        }
        if (data.deepReads && typeof data.deepReads === "object") {
          lsSet(DEEP_KEY, { ...data.deepReads, ...lsGet(DEEP_KEY, {}) });
        }
        const entryCount = data.entries ? Object.keys(data.entries).length : 0;
        if (entryCount > 0) saveEntries(newEntries);
        return { count: entryCount, medCount };
      } catch (e) {
        // not valid JSON — fall through to text parser
      }
    }
    const { result, count } = parseImportText(trimmed);
    if (count > 0) saveEntries(result);
    return { count, medCount: 0 };

        </div>
      )}

      {view === "history" && (
        <div style={{ padding: "16px 20px" }}>
          {sortedDates.length === 0 ? (
            <p style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 13, color: "#484F58", textAlign: "center", marginTop: 40 }}>
              No entries yet. Go log your first day!
            </p>
          ) : (
            sortedDates.map(date => {
              const e = entries[date];
              const moodObj = MOOD_OPTIONS.find(m => m.value === e.mood);
              const sleepObj = SLEEP_OPTIONS.find(s => s.value === e.sleep);
              const bodyTags = (e.body || []).map(b => BODY_TAGS.find(t => t.value === b)).filter(Boolean);
              const skinTags = (e.skin || []).map(s => SKIN_TAGS.find(t => t.value === s)).filter(Boolean);
              const hasBleed = e.bleed && e.bleed !== "none";

              return (
                <div
                  key={date}
                  onClick={() => { setCurrentDate(date); setView("log"); }}
                  style={{
                    background: "#161B22",
                    borderRadius: 10,
                    padding: "12px 16px",
                    marginBottom: 6,
                    cursor: "pointer",
                    borderLeft: `3px solid ${moodObj ? moodColor[moodObj.value] : "#21262D"}`,
                    transition: "all 0.15s",
                  }}
                >
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <span style={{
                        fontFamily: "'DM Sans', sans-serif",
                        fontSize: 12,
                        color: "#8B949E",
                        width: 50,
                      }}>
                        {formatDateShort(date)}
                      </span>
                      <span style={{ fontSize: 16 }}>{moodObj?.emoji || "—"}</span>
                      <span style={{ fontSize: 14 }}>{sleepObj?.emoji || ""}</span>
                      {hasBleed && <span style={{ fontSize: 12 }}>🩸</span>}
                      {e.mucus && <span style={{ fontSize: 12 }}>{(MUCUS_OPTIONS.find(m => m.value === e.mucus) || {}).emoji}</span>}
                    </div>
                    <div style={{ display: "flex", gap: 3, flexWrap: "wrap", justifyContent: "flex-end" }}>
                      {bodyTags.slice(0, 4).map(t => (
                        <span key={t.value} style={{ fontSize: 10 }}>{t.emoji}</span>
                      ))}
                      {skinTags.slice(0, 4).map(t => (
                        <span key={"s" + t.value} style={{ fontSize: 10 }}>{t.emoji}</span>
                      ))}
                    </div>
                  </div>
                  {e.context && (
                    <p style={{
                      fontFamily: "'DM Sans', sans-serif",
                      fontSize: 11,
                      color: "#484F58",
                      margin: "6px 0 0 60px",
                      whiteSpace: "nowrap",
                      overflow: "hidden",
                      textOverflow: "ellipsis",
                    }}>
                      {e.context}
                    </p>
                  )}
                </div>
              );
            })
          )}
        </div>
      )}

      {view === "dashboard" && <Dashboard entries={entries} meds={meds} />}

      {view === "signals" && <Signals entries={entries} meds={meds} date={currentDate} setDate={setCurrentDate} />}

      {view === "meds" && (
        <div style={{ padding: "16px 20px" }}>
          <div style={{
            background: "#161B22",
            borderRadius: 10,
            padding: 16,
            marginBottom: 16,
            border: "1px solid #21262D",
          }}>
            <h3 style={{
              fontFamily: "'Newsreader', Georgia, serif",
              fontSize: 17, fontWeight: 400, color: "#E6EDF3", margin: "0 0 4px",
            }}>Log a medicine change</h3>
            <p style={{
              fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#8B949E",
              margin: "0 0 12px", lineHeight: 1.5,
            }}>Only when something changes: a new med, a stopped med, or a dose change.</p>
            <input
              type="date"
              value={medDate}
              max={getToday()}
              onChange={e => setMedDate(e.target.value)}
              style={{
                width: "100%", minWidth: 0, maxWidth: "100%",
                WebkitAppearance: "none", MozAppearance: "none", appearance: "none",
                display: "block", height: 40,
                padding: "10px 12px", background: "#0A0C10",
                border: "1px solid #21262D", borderRadius: 8, color: "#E6EDF3",
                fontFamily: "'DM Sans', sans-serif", fontSize: 13, outline: "none",
                boxSizing: "border-box", marginBottom: 8,
              }}
            />
            <input
              type="text"
              placeholder="e.g. Wellbutrin 150mg → 300mg"
              value={medNote}
              onChange={e => setMedNote(e.target.value)}
              onKeyDown={e => { if (e.key === "Enter") addMed(); }}
              style={{
                width: "100%", padding: "10px 12px", background: "#0A0C10",
                border: "1px solid #21262D", borderRadius: 8, color: "#E6EDF3",
                fontFamily: "'DM Sans', sans-serif", fontSize: 13, outline: "none",
                boxSizing: "border-box", marginBottom: 10,
              }}
            />
            <button
              onClick={addMed}
              style={{
                width: "100%", padding: "12px", background: "#161B22",
                border: "2px solid #30363D", borderRadius: 10, color: "#E6EDF3",
                fontFamily: "'DM Sans', sans-serif", fontSize: 13, fontWeight: 600, cursor: "pointer",
              }}
            >Add entry</button>
          </div>

          {meds.length === 0 ? (
            <p style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 13, color: "#484F58", textAlign: "center", marginTop: 24 }}>
              No medicine changes logged yet.
            </p>
          ) : (
            [...meds].sort((a, b) => b.date.localeCompare(a.date)).map(m => (
              <div key={m.id} style={{
                background: "#161B22", borderRadius: 10, padding: "12px 16px", marginBottom: 6,
                borderLeft: "3px solid #A371F7", display: "flex",
                justifyContent: "space-between", alignItems: "center", gap: 10,
              }}>
                <div>
                  <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 11, color: "#8B949E", marginBottom: 2 }}>
                    {formatDate(m.date)}
                  </div>
                  <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 13, color: "#E6EDF3" }}>
                    {m.note}
                  </div>
                </div>
                <button
                  onClick={() => removeMed(m.id)}
                  style={{
                    background: "none", border: "none", color: "#484F58", fontSize: 18,
                    cursor: "pointer", padding: "0 4px", flexShrink: 0, lineHeight: 1,
                  }}
                  aria-label="Remove"
                >×</button>
              </div>
            ))
          )}
        </div>
      )}

      {view === "export" && (
        <div style={{ padding: "16px 20px" }}>
          <div style={{
            background: "#161B22",
            borderRadius: 10,
            padding: 20,
            marginBottom: 16,
            border: "1px solid #21262D",
          }}>
            <h3 style={{
              fontFamily: "'Newsreader', Georgia, serif",
              fontSize: 17,
              fontWeight: 400,
              color: "#E6EDF3",
              margin: "0 0 10px",
            }}>
              Back up &amp; share
            </h3>
            <p style={{
              fontFamily: "'DM Sans', sans-serif",
              fontSize: 12,
              color: "#8B949E",
              margin: "0 0 16px",
              lineHeight: 1.6,
            }}>
              JSON keeps every field exactly, and it's the format Claude reads cleanly. Download a file to save it, or copy it to paste into a chat. Both include your meds log.
            </p>
            <button
              onClick={handleDownloadJSON}
              style={{
                width: "100%",
                padding: "14px",
                background: "#1F6FEB22",
                border: "2px solid #388BFD",
                borderRadius: 10,
                color: "#E6EDF3",
                fontFamily: "'DM Sans', sans-serif",
                fontSize: 14,
                fontWeight: 600,
                cursor: "pointer",
                marginBottom: 8,
                transition: "all 0.2s",
              }}
            >
              ⬇ Download backup (.json)
            </button>
            <button
              onClick={handleCopyJSON}
              style={{
                width: "100%",
                padding: "12px",
                background: copiedJSON ? "#2D6A4F" : "#161B22",
                border: `2px solid ${copiedJSON ? "#2D6A4F" : "#30363D"}`,
                borderRadius: 10,
                color: "#E6EDF3",
                fontFamily: "'DM Sans', sans-serif",
                fontSize: 13,
                fontWeight: 600,
                cursor: "pointer",
                marginBottom: 8,
                transition: "all 0.2s",
              }}
            >
              {copiedJSON ? "✓ Copied JSON!" : "Copy JSON to clipboard"}
            </button>
            <button
              onClick={handleCopy}
              style={{
                width: "100%",
                padding: "10px",
                background: "none",
                border: "none",
                color: "#484F58",
                fontFamily: "'DM Sans', sans-serif",
                fontSize: 12,
                cursor: "pointer",
                textDecoration: "underline",
              }}
            >
              {copied ? "✓ Copied readable text" : "Copy readable text instead"}
            </button>
          </div>

          <div style={{
            background: "#161B22",
            borderRadius: 10,
            padding: 16,
            border: "1px solid #21262D",
          }}>
            <div style={{
              fontFamily: "'DM Sans', sans-serif",
              fontSize: 11,
              color: "#484F58",
              marginBottom: 8,
            }}>Preview</div>
            <pre style={{
              fontFamily: "monospace",
              fontSize: 11,
              color: "#7EE787",
              background: "#0A0C10",
              borderRadius: 8,
              padding: 12,
              overflow: "auto",
              maxHeight: 400,
              whiteSpace: "pre-wrap",
              lineHeight: 1.6,
              margin: 0,
            }}>
              {generateExport()}
            </pre>
          </div>

          <div style={{
            background: "#161B22",
            borderRadius: 10,
            padding: 20,
            marginTop: 16,
            border: "1px solid #21262D",
          }}>
            <h3 style={{
              fontFamily: "'Newsreader', Georgia, serif",
              fontSize: 17,
              fontWeight: 400,
              color: "#E6EDF3",
              margin: "0 0 10px",
            }}>
              Restore from backup
            </h3>
            <p style={{
              fontFamily: "'DM Sans', sans-serif",
              fontSize: 12,
              color: "#8B949E",
              margin: "0 0 12px",
              lineHeight: 1.6,
            }}>
              Choose a .json backup file, or paste JSON (or older text) below. New data merges into what's here. This only saves to this device.
            </p>
            <input
              type="file"
              accept="application/json,.json,.txt,text/plain"
              onChange={handleImportFile}
              style={{
                width: "100%",
                fontFamily: "'DM Sans', sans-serif",
                fontSize: 12,
                color: "#8B949E",
                marginBottom: 12,
              }}
            />
            <textarea
              placeholder="…or paste your backup (JSON or text) here"
              value={importText}
              onChange={e => { setImportText(e.target.value); setImportMessage(""); }}
              rows={5}
              style={{
                width: "100%",
                padding: "10px 12px",
                background: "#0A0C10",
                border: "1px solid #21262D",
                borderRadius: 10,
                color: "#E6EDF3",
                fontFamily: "monospace",
                fontSize: 11,
                outline: "none",
                resize: "vertical",
                lineHeight: 1.5,
                boxSizing: "border-box",
                marginBottom: 10,
              }}
            />
            <button
              onClick={handleImport}
              style={{
                width: "100%",
                padding: "12px",
                background: "#161B22",
                border: "2px solid #30363D",
                borderRadius: 10,
                color: "#E6EDF3",
                fontFamily: "'DM Sans', sans-serif",
                fontSize: 13,
                fontWeight: 600,
                cursor: "pointer",
              }}
            >
              Import entries
            </button>
            {importMessage && (
              <p style={{
                fontFamily: "'DM Sans', sans-serif",
                fontSize: 11,
                color: importMessage.startsWith("Imported") ? "#2D6A4F" : "#F47067",
                marginTop: 8,
                marginBottom: 0,
              }}>{importMessage}</p>
            )}
          </div>

          <div style={{ marginTop: 24, textAlign: "center" }}>
            <button
              onClick={async () => {
                if (confirm("Clear all entries and meds? This can't be undone.")) {
                  setEntries({});
                  setMeds([]);
                  try {
                    await window.storage.delete(STORAGE_KEY);
                    await window.storage.delete(MEDS_KEY);
                  } catch (e) {}
                }
              }}
              style={{
                background: "none",
                border: "none",
                fontFamily: "'DM Sans', sans-serif",
                fontSize: 11,
                color: "#484F58",
                cursor: "pointer",
                textDecoration: "underline",
              }}
            >
              Reset all data
            </button>
          </div>
        </div>
      )}

      <style>{`
        input::placeholder, textarea::placeholder {
          color: #30363D;
        }
      `}</style>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<CycleTracker />);
</script>

</body>
</html>
